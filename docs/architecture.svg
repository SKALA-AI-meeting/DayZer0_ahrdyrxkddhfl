  <text x="1022" y="370" text-anchor="middle" class="s">gpt-4o-mini</text>
  <path d="M960,470 q0,-22 26,-22 q8,-16 30,-12 q18,-14 40,4 q24,0 24,22 q12,14 -4,28 q-6,18 -30,14 q-16,12 -36,2 q-22,8 -34,-8 q-24,-4 -16,-28 z" fill="#fff" stroke="#6b7280" stroke-dasharray="5 3"/>
  <text x="1022" y="472" text-anchor="middle" class="t">LangSmith</text>
