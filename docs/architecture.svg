<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" width="1120" height="860" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <style>
      .t{font-size:14px;font-weight:700;fill:#111827}
      .s{font-size:11px;fill:#4b5563}
      .l{font-size:11px;fill:#374151}
      .n{font-size:11px;font-weight:700;fill:#fff}
      .line{stroke:#374151;stroke-width:1.4;fill:none}
      .ex{stroke:#d97706;stroke-width:1.4;fill:none}
      .dot{stroke:#6b7280;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="1120" height="860" fill="#ffffff"/>

  <!-- 화면 -->
  <rect x="400" y="20" width="300" height="64" rx="8" fill="#e8f5ec" stroke="#2f855a" stroke-width="1.5"/>
  <circle cx="414" cy="31" r="2.5" fill="#2f855a"/><circle cx="423" cy="31" r="2.5" fill="#2f855a"/><circle cx="432" cy="31" r="2.5" fill="#2f855a"/>
  <text x="550" y="50" text-anchor="middle" class="t">화면 · Next.js :3000</text>
  <text x="550" y="70" text-anchor="middle" class="s">지원자 가상 오피스 /invite/[token] · 관리자 /admin</text>

  <!-- 1, 8 -->
  <path d="M520,84 L520,128" class="line" marker-end="url(#a)"/>
  <circle cx="506" cy="104" r="8" fill="#2563eb"/><text x="506" y="108" text-anchor="middle" class="n">1</text>
