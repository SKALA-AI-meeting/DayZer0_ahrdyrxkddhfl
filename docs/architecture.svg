  <text x="204" y="152" class="h">gateway · FastAPI :8000</text>
  <text x="896" y="152" text-anchor="end" class="hs">LLM 호출 없음 · 업무 규칙 · DB 쓰기</text>
  <rect x="206" y="170" width="230" height="90" rx="6" class="card"/>
  <text x="321" y="196" text-anchor="middle" class="t">세션 엔진</text>
  <text x="321" y="215" text-anchor="middle" class="s">engine.py · clock.py · work.py</text>
  <text x="321" y="231" text-anchor="middle" class="s">활성 시간 시계 · 장면 1회 실행</text>
  <text x="321" y="247" text-anchor="middle" class="s">업무 칸 진척 · 고정 지문</text>
  <rect x="448" y="170" width="210" height="90" rx="6" class="card"/>
  <text x="553" y="196" text-anchor="middle" class="t">agent_client.py</text>
  <text x="553" y="215" text-anchor="middle" class="s">에이전트 호출 창구 하나</text>
