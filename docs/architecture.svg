<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 870" width="1160" height="870" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
    <style>
      .t{font-size:14px;font-weight:700;fill:#0f172a}
      .h{font-size:13px;font-weight:700;fill:#ffffff}
      .hs{font-size:11px;fill:#cbd5e1}
      .s{font-size:11px;fill:#475569}
      .l{font-size:11px;fill:#334155}
      .lb{font-size:11px;fill:#0e7490}
      .n{font-size:11px;font-weight:700;fill:#fff}
      .line{stroke:#334155;stroke-width:1.4;fill:none}
      .dir{stroke:#0e7490;stroke-width:1.4;fill:none;stroke-dasharray:7 4}
