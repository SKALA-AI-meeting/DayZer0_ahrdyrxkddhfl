  <path d="M580,128 L580,86" class="line" marker-end="url(#a)"/>
  <circle cx="594" cy="104" r="8" fill="#2563eb"/><text x="594" y="108" text-anchor="middle" class="n">8</text>
  <text x="606" y="108" class="l">2초 poll · 새 메시지 · 진행 표시</text>

