  <!-- 범례 -->
  <line x1="20" y1="822" x2="1140" y2="822" stroke="#e2e8f0"/>
  <rect x="24" y="836" width="22" height="14" rx="3" fill="#0f172a"/><text x="52" y="847" class="l">업무 서버 (규칙)</text>
  <rect x="150" y="836" width="22" height="14" rx="3" fill="#0e7490"/><text x="178" y="847" class="l">AI 에이전트</text>
  <rect x="262" y="836" width="22" height="14" rx="3" fill="#fff" stroke="#334155"/><rect x="262" y="836" width="5" height="14" fill="#334155"/><text x="290" y="847" class="l">MCP 서버</text>
  <rect x="362" y="836" width="22" height="14" rx="7" fill="#e2e8f0" stroke="#475569"/><text x="390" y="847" class="l">저장소</text>
