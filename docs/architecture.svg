  <text x="553" y="46" text-anchor="middle" class="t">화면 · Next.js :3000</text>
  <text x="553" y="66" text-anchor="middle" class="s">지원자 가상 오피스 /invite/[token] · 관리자 /admin</text>

  <!-- 1, 8 -->
  <path d="M523,84 L523,126" class="line" marker-end="url(#a)"/>
