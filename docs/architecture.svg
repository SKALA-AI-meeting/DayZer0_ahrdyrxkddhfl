  <text x="311" y="194" text-anchor="middle" class="t">업무 API · 인증</text>
  <text x="311" y="214" text-anchor="middle" class="s">api.py · auth.py</text>
  <text x="311" y="230" text-anchor="middle" class="s">비밀번호 해시 · 서명 토큰</text>
  <text x="311" y="246" text-anchor="middle" class="s">초대 토큰 72시간 · 기업별 분리</text>
