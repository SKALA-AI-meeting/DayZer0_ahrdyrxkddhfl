  <text x="645" y="418" text-anchor="middle" class="s">판별 → 인용·채널·함의 검증</text>
  <text x="645" y="434" text-anchor="middle" class="s">규칙 등급 A~E · 근거</text>
  <rect x="740" y="356" width="154" height="98" rx="6" fill="#fff" stroke="#6b46c1"/>
  <text x="817" y="382" text-anchor="middle" class="t">문서 등록 Graph</text>
  <text x="817" y="402" text-anchor="middle" class="s">doc_graph.py</text>
