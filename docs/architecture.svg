  <rect x="236" y="824" width="22" height="14" rx="3" fill="#f3f0ff" stroke="#6b46c1"/><text x="264" y="835" class="l">Agent 코어</text>
  <path d="M342,831 L347,824 L361,824 L366,831 L361,838 L347,838 z" fill="#eaf1fd" stroke="#2b6cb0"/><text x="372" y="835" class="l">MCP 서버</text>
  <rect x="440" y="824" width="22" height="14" rx="7" fill="#f3f4f6" stroke="#4b5563"/><text x="468" y="835" class="l">저장소</text>
