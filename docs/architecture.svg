  <path d="M710,718 a100,12 0 0,0 200,0 a100,12 0 0,0 -200,0 z" fill="#e2e8f0" stroke="#475569"/>
  <path d="M710,718 L710,786 a100,12 0 0,0 200,0 L910,718" fill="#e2e8f0" stroke="#475569"/>
