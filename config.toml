# Day Zero MVP 설정
# 사람이 판단해 고른 숫자는 모두 여기 둔다. 시나리오 내용(이벤트 시점·문장·문서)은 scenario/ 에 있다.
# 값마다 "무엇을 조절하는지 / 크면·작으면 어떻게 되는지"를 적는다.

[agent]
# gateway가 에이전트(LLM을 부르는 쪽)를 부르는 방식.
# http = 에이전트 서버를 따로 띄워 두고 HTTP로 부른다(레퍼런스: 업무 서버와 FastAPI Agent 분리). 먼저 띄운다:
#        uv run uvicorn app.agent_server:app --port 8001
# inprocess = 같은 프로세스에서 바로 부른다(테스트·터미널 시뮬레이션 app.cli용).
mode = "http"
host = "127.0.0.1"
port = 8001
# 장면 한 번·답장 한 번을 기다리는 최대 시간(초). LLM 재생성·도구 호출을 포함한다.
# 작으면 정상 답도 시간 초과로 실패하고, 크면 에이전트가 멈췄을 때 화면이 오래 기다린다.
request_timeout_seconds = 120
# 리포트 생성(역량 5개 판별 + 재시도)을 기다리는 최대 시간(초). 리포트는 백그라운드라 화면을 막지 않는다.
report_timeout_seconds = 900

[mcp]
# 에이전트가 MCP 서버 2개에 붙는 방식.
# http = 레퍼런스 아키텍처처럼 서버를 따로 띄워 두고(Streamable HTTP) 주소로 연결한다. 여러 클라이언트가 같은 서버를 쓴다.
#        서버를 먼저 띄워야 한다: uv run python -m mcp_servers.business --http / uv run python -m mcp_servers.rag --http
# stdio = 도구를 부를 때마다 에이전트가 서버를 자식 프로세스로 띄운다(설치·포트 없이 동작, 테스트용). 호출마다 프로세스를 띄워 느리다.
transport = "http"
host = "127.0.0.1"
# 포트는 PRD 부록 기술 설계 값(business-mcp :9101, rag-mcp :9102). 다른 프로그램과 겹치면 바꾼다.
business_port = 9101
rag_port = 9102

[session]
# 세션 길이(분). 인성 포커스 버전(팀 결정 2026-10-20)은 업무를 지문으로 처리해 40분으로 줄였다.
# 바꾸면 장면 시점(scenario/<팩>/events.toml)과 어긋나므로 함께 바꾼다.
duration_minutes = 40
# 시간 배속. 1이면 실제 시간, 2면 40분 세션이 20분에 끝난다(시연용). "작업 계속하기"로도 시간이 넘어간다.
# 크면 지원자가 생각하고 쓸 실제 시간이 줄어 타자·반응 속도가 결과에 끼어든다(예: 동료가 털어놓은 뒤 팀장이 먼저 묻기까지
# 세션 5분이 배속 2에서는 실제 2분 30초). 인성만 보려고 실제 평가는 1로 둔다(2026-10-20 점검). 시연할 때만 올린다.
time_scale = 1.0
# 화면이 이 시간(초) 넘게 서버에 묻지 않으면 세션 시계를 멈춘다(F-19 "남은 시간 그대로 이어짐").
# 작으면 잠깐 끊긴 네트워크에도 시계가 멈추고, 크면 창을 닫은 뒤에도 그만큼 시간이 흐른다.
pause_after_idle_seconds = 15
# 화면이 새 메시지를 묻는 간격(초). 작으면 이벤트가 정시에 더 가깝게 뜨지만 요청이 늘어난다.
poll_interval_seconds = 2
# 지원자 무응답 확인까지의 시간(분). PRD 7.4·F-25 값.
idle_check_minutes = 10
# 초대 링크 유효 시간(시간). PRD F-02 값.
invite_ttl_hours = 72
# 이 장면(팀장의 보고 요청)이 실행된 뒤에만 지원자가 "업무 마치기"를 누를 수 있다.
# 그 전에 끝내면 뒤의 상황을 겪지 못해 역량을 판단할 수 없으므로 막는다(시간이 다 되면 자동 종료는 그대로).
finish_after_scene = "report_request"
# 늦게 공개되는 문서(F-15, 예: 인터뷰 요약 01:05)가 열리는 순간 보내는 시스템 알림. {title}에 문서 제목이 들어간다.
# 이 알림이 없으면 동료·팀장이 00:50의 "늦게 공유됩니다"만 보고 공개 뒤에도 "곧 올라올 거예요"라고 답한다.
doc_shared_notice = "'{title}' 문서가 공유됐어요. 이제 회사 문서에서 열어 볼 수 있습니다."

[work]
# "작업 계속하기" 한 번에 넘어가는 세션 시간(분). 다음 장면 시각을 넘지는 않는다(장면은 모두에게 같은 시점에).
# 크면 세션이 빨리 끝나 대화할 기회가 줄고, 작으면 버튼을 여러 번 눌러야 해서 지루해진다.
skip_minutes = 5
# 업무 메모 최대 글자 수. 긴 계획서를 쓰는 능력이 끼어들지 않게 짧게 제한한다.
# 크면 글솜씨 차이가 드러나고, 작으면 무엇을 할지 적기 어렵다.
memo_max_chars = 100
# 동료 미이행 뒤 지원자가 팀장 1:1에 이만큼 쓰면, 팀장이 답한 직후 대상 변경(pivot)을 전한다("상담 마무리하면서").
# 크면 상담이 길어진 뒤에 변경이 나오고(상한 시각에 걸리기 쉬움), 작으면 상담이 시작되자마자 변경이 나온다.
consult_turns_before_pivot = 2
# 동료 미이행(coworker_miss) 장면 전에 지원자가 동료에게 이 표현으로 진행 상황을 물으면 그때 털어놓게 한다.
# 많이 넣으면 평범한 말에도 일찍 털어놓고, 적으면 중간 점검을 했는데도 15분까지 숨기게 된다.
# "진행할게요", "수고하셨어요"처럼 진행 상황을 묻지 않는 말과 겹치는 짧은 표현("진행", "하셨어요")은 넣지 않는다.
# "중간 점검", "상황 공유"는 분담할 때 계획으로도 말하므로("10분쯤 중간 점검 해요") 넣지 않는다.
# 아래 question_markers 중 하나도 함께 있어야 묻는 말로 본다("진행 상황은 10분마다 공유해요"는 계획이지 질문이 아니다).
progress_check_phrases = ["진행 상황", "진행상황", "진행 어때", "진행은 어때", "진행은 좀", "진행 좀 어", "어디까지 하셨", "어디까지 됐",
                          "얼마나 하셨", "얼마나 됐", "얼마나 진행", "잘 되고 있", "잘 돼 가", "잘 되어 가", "잘돼가",
                          "쪽은 어때", "쪽은 어떻", "하고 계신 거 어때", "어떻게 되어 가", "어떻게 돼 가", "어떻게 되고 있"]
# 업무 메모에 누군가에게 말하겠다는 계획이 있는지 보는 말(규칙 관찰 memo_followed_through). 상대는 팀장·동료 이름으로 정한다.
# 많으면 평범한 메모도 소통 계획으로 잡고, 적으면 "팀장님께 말씀드리기" 같은 계획을 놓친다.
memo_contact_words = ["보고", "공유", "말씀", "전달", "알리", "알려", "요청", "상의", "얘기", "이야기"]
# 진행 상황 "질문"으로 볼 표지. 많으면 계획을 말한 문장도 질문으로 잡고, 적으면 물음표 없이 물은 말을 놓친다.
question_markers = ["?", "어떠세요", "어때요", "어떤가요", "어떻게 돼", "어떻게 되", "됐나요", "됐어요?", "있나요", "인가요", "까요", "주실 수", "알려 주", "알려주"]

[negotiation]
# 분업 조정 최대 횟수. PRD F-21 값. 넘으면 마지막 안으로 진행.
max_rounds = 3
# 분업 장면(00:10) 전에 지원자가 동료 1:1에서 이 표현으로 분담을 꺼내면 분업 단계를 그때 시작한다.
# 없으면 동료가 따로 답하고, 00:10에 같은 분담안을 또 말하며, 그 전의 "좋아요"는 동의로 처리되지 않는다.
# 많이 넣으면 분담과 무관한 말에도 분업이 시작되고, 적으면 위 문제가 남는다.
split_request_phrases = ["분담", "분배", "배분", "역할 나", "업무 나", "일 나", "나눠", "나눌까", "나누면"]

[llm]
# 사용할 모델. 팀 API 키 제약으로 gpt-4o-mini만 가능(PRD 부록).
model = "gpt-4o-mini"
# 동료·팀장 대사의 다양성. 크면 말투가 다양해지고 작으면 반복적이 된다.
persona_temperature = 0.6
# 관찰 판별용. 0에 가까울수록 같은 대화에 같은 판단이 나온다(재현성).
judge_temperature = 0.0
# 호출 실패(429·503 등) 시 재시도 횟수. 과제 Harness 기준 2회. 크면 버티지만 응답이 늦어진다.
retry_count = 2
# 재시도 사이 대기(초). 작으면 빨리 재시도하지만 rate limit에 다시 걸리기 쉽다.
retry_backoff_seconds = 2.0

[agent_loop]
# 페르소나 응답 한 번에 도구 호출 최대 횟수. PRD 부록 초기값 3. 크면 더 찾아보지만 느리고 비싸다.
max_tool_calls_per_reply = 3
# 한 번의 처리에서 Graph가 도는 최대 턴. 과제 Harness 기준 8. 무한 반복 방지.
max_turns = 8
# 한 번의 처리 제한 시간(초). 과제 Harness 기준 120.
task_timeout_seconds = 120
# 같은 도구를 연속 호출할 수 있는 최대 횟수. 과제 Harness 기준 3.
same_tool_max = 3

[verify]
# 발화 검증(판정 발언·필수 내용·출처)에 실패했을 때 다시 생성하는 최대 횟수.
# 크면 통과율이 오르지만 지연·비용이 늘고, 작으면 대체 문장이 자주 나간다.
max_regenerations = 2
# 검증을 끝내 통과하지 못했을 때 내보내는 안전한 대체 문장 (사실을 지어내지 않는 문장).
fallback_reply = "지금은 확인된 내용으로 답하기 어려워요. 조금 더 구체적으로 말씀해 주실 수 있을까요?"
# LLM 호출이 재시도 후에도 끝내 실패했을 때 동료·팀장이 보내는 문장(PRD A.4, 500 오류 대신).
llm_failure_reply = "앗, 제 쪽 연결이 잠깐 불안정했어요. 방금 내용을 한 번만 다시 보내 주시겠어요?"
# 동료가 자기 업무 결과물을 이미 만든 것처럼 말하는 표현. 동료는 업무를 거의 못 하는 설정이라(장면 coworker_miss)
# 이 표현이 나오면 "진행 중이라고만 말하라"며 다시 생성한다(하지 않은 일을 지어내지 않게).
unshared_claim_phrases = ["정리해봤", "정리해 봤", "찾아봤", "찾아 봤", "작성해봤", "작성해 봤", "다 정리했", "다 작성했", "완성했", "다 했어요"]
# 찾아보지도 않고 포기하는 표현. 이번 답에서 도구를 한 번도 안 불렀는데 이 표현이 있으면
# "회사 문서를 먼저 검색해 보고 답하라"며 다시 생성한다. 많으면 정상 거절도 다시 생성되고, 적으면 놓친다.
no_lookup_phrases = ["제공할 수 없", "확인할 수 없", "알 수 없", "드릴 수 없", "정보가 없"]
# 킥오프(00:00) 뒤에 이 표현이 나오면 "세션 시작 때의 남은 시간을 반복했다"고 보고 지금 시각에 맞게 다시 생성한다.
# 세션 길이(duration_minutes)를 바꾸면 함께 바꾼다. 많이 넣으면 정상 문장도 다시 생성되고, 적으면 놓친다.
stale_deadline_phrases = ["40분 뒤", "40분 후", "40분 안에", "40분 동안"]
# 늦게 공개되는 문서(예: 인터뷰 요약 01:05)가 이미 공개된 뒤에 이 표현이 나오면 "아직 안 왔다고 말함"으로 보고 다시 생성한다.
# 동료가 자기 파트를 "공유할게요"라고 하는 말과 겹치지 않게 '남이 공유해 줄 것'을 기다리는 표현만 넣는다.
stale_doc_phrases = ["공유되면", "공유된다면", "공유될 예정", "공유되는 대로", "올라오면", "올라올 거", "올라올 예정", "늦게 공유"]
# "확인해 볼게요"처럼 행동을 약속만 하는 표현. 이번 답에서 도구를 한 번도 안 불렀는데 이 표현이 있으면
# 말만 하고 실행하지 않은 것으로 보고 "지금 도구로 확인해 답하라"며 다시 생성한다.
# 많이 넣으면 정상 답도 다시 생성되고, 적으면 약속만 하는 답이 그대로 나간다.
deferral_phrases = ["확인하고", "검토하고", "확인해볼게요", "확인해 볼게요", "읽어보고", "읽어 보고", "살펴보고", "살펴볼게요", "잠시만 기다려", "찾아보고", "확인 후 말씀", "확인한 뒤 말씀"]
# 동료·팀장이 지원자의 행동·보고를 칭찬·평가하는 표현(지시문이 금지하지만 모델이 어김: "예산안 초안이 잡힌 점은 좋습니다").
# 이 표현이 나오면 빼고 다시 생성하고, 끝내 나오면 그 문장만 빼고 내보낸다.
# 제안을 받아들이는 "좋습니다"·"좋아요"는 넣지 않는다. 많이 넣으면 정상 답도 다시 생성되고, 적으면 칭찬이 새어 나간다.
praise_phrases = ["점은 좋", "것도 좋", "것은 좋", "잘하셨", "잘 하셨", "잘했", "잘 했", "훌륭", "좋은 판단", "책임감 있", "잘 대처", "잘 되고", "잘되고", "인상적"]

[context]
# 도구 결과를 모델에 넘길 때 최대 글자 수. 크면 근거가 풍부하지만 Token이 늘어난다.
tool_result_max_chars = 2000
# 대화 기록을 모델에 넣을 때 Token 예산(대략). 넘는 앞부분은 LLM으로 요약해 넣는다(app/persona.py context).
# 크면 맥락을 더 기억하지만 비용·지연이 늘어난다.
history_token_budget = 6000

[rag]
# 검색 방식. vector = 미리 색인한 임베딩 유사도(레퍼런스 아키텍처), keyword = 단어 일치.
# vector에서 임베딩 호출이 실패하면 자동으로 keyword로 대신 찾는다(Recovery).
search_mode = "vector"
# 임베딩 모델. 바꾸면 색인을 다시 만든다(색인에 모델 이름·차원을 함께 저장).
embedding_model = "text-embedding-3-small"
# vector 모드에서 질문이 문서 제목을 지목할 때("인터뷰 요약에서…") 더하는 유사도.
# 크면 제목을 말한 문서가 확실히 먼저 나오고, 작으면 본문이 더 비슷한 다른 문서가 앞설 수 있다.
vector_title_bonus = 0.1
# 검색 결과로 돌려줄 문단 수. 크면 근거가 많아지지만 모델 입력이 길어진다.
top_k = 3
# 검색어가 문서 제목에 들어 있을 때 더하는 점수. 크면 "인터뷰 요약 알려줘"처럼 문서를 지목한
# 질문에서 그 문서가 확실히 먼저 나오고, 작으면 본문 단어가 많이 겹치는 다른 문서가 앞설 수 있다.
title_match_weight = 3

[observation]
# 인용 검증: LLM이 인용한 문장이 실제 메시지에 이 비율 이상 일치해야 근거로 인정.
# 크면 엄격(정확히 같은 문장만), 작으면 느슨(비슷한 문장도 인정).
quote_match_threshold = 0.9
# 판별기가 일부 체크에 답하지 않았을 때, 빠진 체크만 다시 묻는 횟수. 넘어도 빠져 있으면
# "판별기가 답하지 않음"으로 기록한다(조용히 '관찰 없음'이 되지 않게). 크면 비용이 늘고, 0이면 다시 묻지 않는다.
judge_missing_retries = 1
# 판별기가 "예"라고 했지만 근거가 검증에서 버려진 체크(인용이 원문에 없음·행동을 뒷받침 못 함 등)를
# 버린 이유를 알려 주고 다시 묻는 횟수. 맞는 메시지를 다른 체크에 넣거나 동료 말을 인용한 경우를 되살린다.
# 크면 비용이 늘고, 0이면 버려진 체크는 그대로 "관찰 없음"이 된다.
judge_dropped_retries = 1

[guard]
# 지원자 메시지에 이 표현이 있으면 LLM을 부르지 않고 정해진 안내문(prompts/guard.md)으로 답한다(F-24).
# 많이 넣으면 평범한 업무 질문까지 막히고, 적으면 평가 기준 질문이 LLM으로 넘어간다.
# "점수", "떨어", "시나리오"처럼 업무 대화에도 흔한 단어는 넣지 않는다(오탐: "재참여율이 떨어진 이유" 등).
evaluation_question_keywords = ["평가 기준", "평가기준", "어떻게 평가", "평가 방식", "평가 결과", "몇 점", "제 점수", "내 점수", "합격", "불합격", "탈락", "채점", "평가 항목"]
# AI 응답에 이 표현이 있으면 판정 발언으로 보고 한 번 다시 생성, 그래도 있으면 안내문으로 바꾼다(F-24).
# 많이 넣으면 정상 답변도 다시 생성되고(비용 증가), 적으면 판정 발언이 새어 나갈 수 있다.
# 업무 답변에 흔한 "점수"(만족도 점수), "시나리오"(사용자 시나리오)는 넣지 않는다.
forbidden_output_keywords = ["합격", "불합격", "탈락", "평가 결과", "평가 항목", "평가 기준", "채점", "연출된", "연출될"]

[auth]
# 관리자 로그인 토큰 유효 시간(시간). 길면 편하지만 토큰이 새면 오래 악용될 수 있다.
admin_token_hours = 8
# 비밀번호 해시(PBKDF2) 반복 횟수. 크면 무차별 대입에 강하지만 로그인이 느려진다.
pbkdf2_iterations = 200000

[grade]
# 역량별 참고 등급 A~E(팀 결정 2026-10-20: 점수 표시는 팀마다 자율). LLM이 아니라 코드가 검증된 근거로 계산한다(app/report.py grade).
# 1) 비율 = 관찰된 바람직한 행동 수 / 그 역량의 바람직한 행동 체크 수(LLM 체크만, 1을 넘으면 1).
#    규칙 관찰(먼저 분담을 꺼냄, 중간 점검으로 일찍 알게 됨 등)은 했을 때만 분자에 더하는 가산점이다(분모에 넣지 않음:
#    모두에게 기회가 있는 행동이 아니라서, 분모에 넣으면 대부분 지원자의 등급이 낮아진다).
# 2) 비율로 기본 등급: min_ratio[0] 이상 A, [1] 이상 B, [2] 이상 C, 0보다 크면 D, 0이면 E.
# 3) 반대 방향 행동(동료 탓, 다 된 것처럼 보고)이 하나 있을 때마다 negative_step 단계 내린다(E 아래로는 안 내려감).
# 4) 상황 자체가 안 일어나면 pending_label.
labels = ["A", "B", "C", "D", "E"]
# A·B·C의 최소 비율. 크면 높은 등급이 드물어지고, 작으면 한두 가지만 해도 높은 등급이 된다.
min_ratio = [0.75, 0.5, 0.25]
# 반대 방향 행동 하나당 내리는 단계 수. 크면 한 번의 동료 탓으로 크게 떨어지고, 0이면 반대 방향 행동을 등급에 반영하지 않는다.
negative_step = 1
pending_label = "판단 보류"

[report]
# 리포트 생성 실패 시 재시도 횟수(F-34). 넘으면 상태를 "실패"로 바꾼다.
retry_count = 2
# 요소별 사실 요약(근거 정리). 판단은 하지 않고 검증된 근거만 번호를 달아 나란히 적는다.
# 근거가 이 개수보다 적으면 요약하지 않는다(1개면 원문이 곧 요약). 크면 요약이 드물게, 작으면 자주 붙는다.
summary_min_evidence = 2
# 요약 문장 수 상한. 크면 원문을 다시 늘어놓게 되고, 작으면 대화·기획안을 나란히 적기 어렵다.
summary_max_sentences = 3
# 요약 검증에 실패했을 때 다시 만드는 횟수. 넘으면 요약을 숨기고 근거 원문만 보인다.
summary_attempts = 2
# 요약에 있으면 버리는 평가 표현(가드 금지어에 더해). 많으면 사실 문장도 버려지고, 적으면 평가가 섞인다.
summary_forbidden_words = ["모순", "일관성", "일관되", "우수", "부족", "미흡", "훌륭", "뛰어", "아쉽", "바람직", "적극적", "소극적",
                           "긍정적", "부정적", "잘했", "잘 했", "잘못", "칭찬할", "높이 평가", "역량", "태도가"]
