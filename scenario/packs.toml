# 시나리오 팩 목록. 기업이 가입할 때 팩 하나(모든 지원자가 같은 팩) 또는 "random"(지원자마다 무작위 팩)을 고른다.
# random은 팩이 아니라 app/settings.py RANDOM_PACK 값이다. 체크 목록이 모든 팩에서 같아서 등급을 나란히 볼 수 있다.
# 팩마다 장면 id·관찰 요소 구조는 같고, 회사·과제·문서·대사 내용만 다르다 → 에이전트 코드는 그대로.
# moarun = 인성 포커스 버전(동료와 둘이 맡은 프로젝트, 업무는 지문 처리). 팀 결정(2026-10-20)으로 범위를 좁혔다.
# workshop = 업무 밖 상황(전사 워크숍 기획). 체크 목록은 같고 이야기·사건 종류·시각이 다르다(+ 험담 장면).
default = "moarun"

[[pack]]
id = "moarun"
dir = "moarun"

[[pack]]
id = "workshop"
dir = "workshop"

# onsite = SI 회사 직원의 고객사 상주(동료가 고객사 과장의 범위 밖 요청을 팀장 몰래 처리).
[[pack]]
id = "onsite"
dir = "onsite"
