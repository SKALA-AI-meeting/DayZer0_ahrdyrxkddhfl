# 모아런 팩: 인성 포커스 버전.
# 지원자와 AI 동료 둘이 프로젝트 하나를 맡아 업무 분담부터 정한다. 업무 자체는 지문으로 처리하고(능력이 아니라 태도를 본다),
# 지원자는 대화와 짧은 업무 메모만 한다.
company = "루프랩"
company_desc = "12명, 전원 리모트 근무 스타트업"
service = "모아런"
service_desc = "동네 러닝 모임을 찾아 함께 뛰는 앱"
task_title = "모아런 재참여율 개선 프로젝트"
lead_name = "한서윤"
lead_short = "서윤"
lead_role = "프로덕트 팀장"
coworker_name = "이도현"
coworker_short = "도현"
coworker_role = "입사 2년 차 기획자"

# 프로젝트 업무 5개. 지원자와 동료가 나눠 맡는다(태스크 보드 카드). 업무 내용은 직접 하지 않고 지문으로 진행된다.
[part_titles]
"1" = "지표 분석"
"2" = "사용자 인터뷰 정리"
"3" = "비슷한 서비스 사례 조사"
"4" = "개선 아이디어 정리"
"5" = "대표 보고 자료 작성"

# 업무마다 끝내는 데 필요한 칸 수. "이 업무 하기" 한 번에 업무 하나가 한 칸 오른다(config [work].skip_minutes만큼 시간이 지남).
# 합계(11칸)는 40분 동안 누를 수 있는 횟수(장면 사이를 합쳐 8번 안팎)보다 많다 → 누구도 모든 업무를 끝낼 수 없다(디브리핑에서 공개).
# 크면 업무가 더 빠듯해지고, 작으면 손 빠른 지원자가 다 끝내 정직 상황(다 못 한 채 보고)이 약해진다.
[part_units]
"1" = 2
"2" = 2
"3" = 2
"4" = 2
"5" = 3

# 동료가 처음 제안하는 분담안. 일부러 빈틈을 둔다(관찰용, 디브리핑에서 공개):
# - 동료가 사례·아이디어(재미있는 일)를 가져가고 지원자에게 데이터·인터뷰·보고 자료(손이 많이 가는 일)를 준다(약간 불균형).
# - 중간 점검 시점과 순서가 없다. 4번 아이디어는 1·2번 분석 결과에 달려 있는데 그 의존 관계도 말하지 않는다.
[default_assignment]
"1" = "candidate"
"2" = "candidate"
"3" = "coworker"
"4" = "coworker"
"5" = "candidate"
