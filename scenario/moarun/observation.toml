# 관찰 항목 정의 (하이브리드 B) — 인성 포커스 버전, 역량 5개 (팀 결정 2026-10-20)
# - 체크 항목은 모두 "행동"으로 정의한다 (말투·공손함·업무 결과물의 품질 항목 금지: 능력이 아니라 태도를 본다).
# - scene: 관찰 구간의 시작 장면. 장면이 실제로 실행된 시각부터 window_end_minute까지의 지원자 메시지·업무 메모만 본다.
#   window_end_scene: 그 장면이 window_end_minute보다 먼저 실행되면 거기서 구간을 끝낸다(예: 계획 단계는 동료 미이행 전까지).
# - candidate_keywords: 관련 메시지 "후보"를 넓게 찾는 용도. 키워드만으로 확정하지 않는다.
#   후보가 0개여도 LLM은 구간 전체 메시지를 본다(키워드 누락 대비).
# - checks: LLM이 예/아니오 + 원문 인용으로 답한다. 인용은 코드가 실제 메시지와 대조해 검증한다.
#   evidence_scope: messages = 지원자가 보낸 메시지만 / memo = 지원자의 업무 메모만 / all = 둘 다(기본)
#   channels: 근거 메시지가 이 채널 중 하나여야 한다(예: 팀장에게 알렸는가 → lead_dm·team). 없으면 채널 제한 없음.
#     team = 팀 채널(팀장도 봄), dm = 동료 1:1, lead_dm = 팀장 1:1, work = 업무 메모
#   quote_must_contain: 인용에 이 말 중 하나가 있어야 그 행동의 근거로 인정한다(과장된 행동 문장 방지).
#   quote_must_not_contain: 인용에 이 말(부정·제외 표현)이 있으면 근거로 인정하지 않는다(함의 검증으로 다시 본다).
#   애매하면 버리는 쪽: 하지 않은 일을 했다고 적는 것보다 놓치는 쪽이 안전하다(PRD 9장 단정 금지).
# - point: 리포트에서 근거 옆에 보이는 관찰 포인트. 해당한 포인트만 보이고 해당하지 않은 목록·개수는 보이지 않는다.
# - rules: LLM 없이 기록만으로 확정하는 관찰(app/observe.py RULES). 예: 팀장이 묻기 전에 먼저 연락했는가.
# - direction: positive(바람직한 행동, 기본) | negative(반대 방향 행동: 동료 탓, 다 된 것처럼 보고).
#   참고 등급(A~E)은 검증된 근거로 코드가 계산한다(app/report.py grade, 기준은 config [grade]).
#   LLM은 근거만 찾고 등급을 매기지 않는다. 규칙 관찰은 가산점(했을 때만 분자에 더함, 분모에 넣지 않음).

[[element]]
name = "계획성·꼼꼼함"
# 일정 관리 성향을 본다(인성검사의 계획성): 시간 배분·마감, 중간 점검, 정해지지 않은 부분 확인.
# 업무 사이 의존 관계를 알아채는 것은 기획 분석력이라 보지 않는다(2026-10-20 점검).
# set_timebox의 필수어에 "분" 한 글자를 넣으면 "분석"에도 걸려 의존 관계만 말한 문장이 통과했다 → "분까지"처럼 시간 표현으로만 둔다.
scene = "negotiate"
situation = "빈틈 있는 분담안 (일정·중간 점검이 빠짐)"
window_end_minute = 15
window_end_scene = "coworker_miss"
candidate_keywords = ["일정", "중간", "점검", "체크", "순서", "먼저", "까지", "언제", "결과", "기준", "범위", "어디까지", "분"]
checks = [
  { id = "clarified_scope", point = "미션의 범위·결과물·보고 방식을 질문으로 확인함", evidence_scope = "messages", quote_must_contain = ["?", "까요", "나요", "는지", "인가요", "건가요", "을까", "ㄹ까"], question = "지원자가 미션에서 정해지지 않은 부분(결과물의 형태나 분량, 보고 방식, 대표님이 원하는 것 등)을 팀장이나 동료에게 물었는가? 동료 업무가 밀린 뒤 범위를 줄여도 되는지 묻는 말은 해당하지 않는다." },
  { id = "set_checkpoint", point = "일정이나 중간 점검 시점을 정하자고 제안함", evidence_scope = "messages", quote_must_contain = ["분", "시까지", "중간", "점검", "체크", "공유", "까지", "일정", "맞춰"], question = "지원자가 업무 일정이나 중간에 서로 진행 상황을 맞춰 볼 시점을 정하자고 제안했는가?" },
  { id = "set_timebox", point = "업무별 시간 배분이나 마감 시각을 정함", quote_must_contain = ["분까지", "분쯤", "분 동안", "분동안", "분만", "분에", "분 안에", "분 뒤", "분 후", "분간", "까지 끝", "언제까지", "마지막", "시간"], question = "지원자가 업무별로 언제까지 끝낼지(마감 시각)나 시간을 얼마나 쓸지(시간 배분)를 정하거나 그렇게 정하자고 제안했는가? 대화와 업무 메모 모두 해당한다. 업무 사이의 순서나 의존 관계(예: '분석이 나와야 아이디어를 정할 수 있다')만 말하고 시간을 정하지 않았으면 no. 서로 진행을 맞춰 볼 중간 점검 시점만 정한 것은 별도 항목이므로 no." },
]
rules = [{ id = "early_progress_check", point = "동료 진행 상황을 중간에 확인해 지연을 일찍 알게 됨" },
         { id = "initiated_split", point = "동료가 분담안을 내기 전에 먼저 업무 분담을 꺼냄" }]

[[element]]
name = "협업·조율"
scene = "negotiate"
situation = "약간 불균형한 분담안, 동료의 업무 미이행"
window_end_minute = 40
candidate_keywords = ["나눠", "나누", "같이", "대신", "제가", "괜찮", "사정", "도와", "조정", "바꿔", "맡"]
checks = [
  { id = "proposed_adjustment", point = "분담안의 불균형·빈틈에 조정을 제안함", evidence_scope = "messages", channels = ["dm", "team"], quote_must_contain = ["나눠", "나누", "바꿔", "바꾸", "맡", "같이", "대신", "조정", "번은", "번을", "번도", "번만", "도와", "넘겨", "해 주", "해주", "부탁", "제가"], question = "지원자가 동료가 제안한 분담안을 다르게 나누자고 제안했는가? 업무 하나를 동료에게 넘기거나 도와 달라고 하는 것(예: '보고 자료만 도와주세요'), 함께 하자고 하는 것, 맡을 업무를 바꾸자고 하는 것 모두 해당한다. 그대로 수락만 했으면 no." },
  { id = "asked_situation", point = "동료가 못 한 사정을 묻거나 이해를 표현함", evidence_scope = "messages", channels = ["dm", "team"], quote_must_contain = ["괜찮", "사정", "무슨 일", "무슨 급한", "어떤 일", "힘드", "힘들", "바쁘", "차출", "급한", "그럴 수", "이해", "불려", "정신없", "고생", "셨군요", "셨겠"], question = "동료가 맡은 업무를 거의 못 했다고 털어놓은 뒤, 지원자가 동료의 사정을 묻거나 그럴 수 있다고 이해하는 말을 했는가? 놀람·불만을 담은 반문('진짜요?', '어떻게 하실 건데요?')은 해당하지 않는다." },
  { id = "redistributed", point = "남은 일을 다시 나누거나 돕겠다고 제안함", evidence_scope = "messages", channels = ["dm", "team"], quote_must_contain = ["제가", "나눠", "나누", "같이", "대신", "도와", "맡", "할게", "해볼게", "해 볼게", "부탁", "해 주", "해주", "하실 수", "초안", "넘겨"], question = "동료가 업무를 못 했다고 한 뒤, 지원자가 남은 일을 동료와 다시 나누자고 동료에게 말했는가? 자기가 일부를 맡겠다고 하는 것, 동료에게 줄인 일(예: '초안만', '한 부분만 공유')을 부탁하는 것, 함께 하자고 하는 것 모두 해당한다. 팀장에게 한 말은 근거가 아니다." },
  { id = "blamed", point = "동료를 탓하거나 비난하는 말을 함", direction = "negative", evidence_scope = "messages", question = "지원자가 동료(이도현)를 탓하거나 비난하는 말을 했는가? 동료에게 직접 한 말과 팀장에게 동료 탓을 한 말 모두 해당한다. 사실만 전한 말은 해당하지 않는다." },
]

[[element]]
name = "책임감·성실성"
scene = "coworker_miss"
situation = "동료가 맡은 업무를 거의 못 함 (프로젝트 마감 위험)"
window_end_minute = 40
candidate_keywords = ["팀장", "보고", "말씀", "알려", "공유", "대신", "제가", "메우", "우선", "먼저", "줄이", "범위"]
checks = [
  { id = "escalated", point = "동료 업무 공백이나 마감 위험을 팀장에게 알림", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_contain = ["못", "밀", "늦", "어렵", "비어", "차출", "지연", "공백", "위험", "부족", "덜"], question = "지원자가 업무가 밀렸거나 비어 있다는 사실, 또는 마감이 어렵다는 사실을 팀장에게 알렸는가? 이유를 어떻게 설명했는지(동료 사정, 동료 탓, 자기 탓)는 상관없다. 팀장의 보고 요청 전후 모두 해당한다." },
  { id = "recovery_plan", point = "남은 일을 어떻게 처리할지 계획이나 대안을 냄", quote_must_contain = ["제가", "대신", "나눠", "나누", "먼저", "우선", "줄이", "빼", "메우", "맡", "같이", "순서", "범위", "까지만", "접", "집중", "내려놓"], question = "동료 업무 공백을 알게 된 뒤, 지원자가 남은 일을 어떻게 처리할지(우선순위, 범위 줄이기·빼기, 다시 나누기, 자기가 맡기 등) 계획이나 대안을 대화나 업무 메모에서 냈는가? 대상 변경에 대응하며 낸 계획이어도 남은 일 처리 방법이면 해당한다." },

]
rules = [{ id = "contacted_lead_first", point = "팀장이 묻기 전에 먼저 팀장에게 연락함" },
         { id = "memo_followed_through", point = "업무 메모에 적은 소통 계획대로 실제로 메시지를 보냄" }]

[[element]]
name = "적응성·유연성"
scene = "pivot"
situation = "막판 대상 변경 ('오래 안 나온 사용자', 기준은 흐리게, 마감은 그대로)"
window_end_minute = 40
candidate_keywords = ["오래", "기준", "개월", "휴면", "대상", "범위", "우선", "줄이", "바뀌", "변경", "일정"]
checks = [
  { id = "asked_criteria", point = "바뀐 대상의 기준·범위를 확인하는 질문", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_contain = ["?", "까요", "나요", "는지", "인가요", "건가요", "기준", "개월", "얼마나", "몇"], question = "지원자가 바뀐 대상('오래 안 나온 사용자')의 기준이나 범위를 팀장에게 확인했는가?" },
  { id = "renegotiated", point = "범위·우선순위·일정을 다시 정하자고 제안함", evidence_scope = "messages", quote_must_contain = ["범위", "우선", "빼", "줄이", "먼저", "순서", "일정", "조정", "나눠", "대신", "까지만", "만 하", "만 잡", "만 할", "이번엔", "집중", "내려놓", "접"], question = "대상 변경을 들은 뒤 지원자가 할 일의 범위나 우선순위를 바꾸겠다고(예: 무엇을 빼거나 줄이거나 먼저 하겠다고) 팀장이나 동료에게 말했는가? 변경을 수락만 했으면 no. 업무 메모는 근거가 아니다." },
  { id = "shared_change", point = "바뀐 내용을 동료에게 전함", evidence_scope = "messages", channels = ["dm", "team"], quote_must_contain = ["대상", "바뀌", "바꾸", "바꿔", "변경", "오래", "휴면", "개월", "팀장"], question = "지원자가 팀장에게 들은 대상 변경을 동료(이도현)에게 전했는가? (동료는 이 변경을 듣지 못했다)" },
  { id = "replanned_in_memo", point = "업무 메모에서 바뀐 방향으로 계획을 다시 세움", evidence_scope = "memo", quote_must_contain = ["대상", "바뀐", "변경", "오래", "휴면", "개월", "다시", "우선", "범위", "빼", "줄이", "접", "집중"], question = "대상 변경 뒤 지원자가 업무 메모에서 할 일이나 우선순위를 다시 정했는가(무엇을 빼거나 무엇에 집중하겠다는 메모 포함)?" },
]

[[element]]
name = "정직·공정한 보고"
scene = "report_request"
situation = "끝낼 수 없는 상황에서 '다 됐죠?'라는 보고 요청"
window_end_minute = 40
candidate_keywords = ["못", "아직", "덜", "남아", "일부", "도현", "동료", "차출", "다 됐", "완료", "끝났"]
checks = [
  { id = "disclosed_incomplete", point = "끝나지 않은 업무나 지연을 보고에서 밝힘", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_contain = ["못", "아직", "덜", "안 됐", "안됐", "남아", "부족", "일부", "어렵", "지연", "늦", "비어", "까지만"], question = "보고 요청 뒤 지원자가 팀장에게 끝나지 않은 업무나 비어 있는 부분을 하나라도 밝혔는가? 다른 말(예: '거의 다 됐다')과 함께 했어도 해당한다." },
  { id = "fair_about_coworker", point = "동료 쪽 상황을 사실대로 전함 (차출된 사정 포함)", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_contain = ["차출", "급한", "다른 업무", "다른 일", "빠지", "빠졌", "불려"], question = "지원자가 팀장에게 동료(이도현)가 다른 급한 업무에 차출돼 맡은 일을 못 했다는 사정을 사실대로 전했는가? 동료 일도 다 됐다고 하거나, 동료 탓만 하거나, 사정 없이 자기 탓으로 돌린 말은 해당하지 않는다." },
  { id = "overclaimed", point = "끝나지 않은 업무를 다 된 것처럼 보고함", direction = "negative", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_not_contain = ["못", "아직", "덜", "안 됐", "안됐", "남아", "일부", "어렵", "지연", "늦", "까지만"], question = "지원자가 끝나지 않은 업무를 다 끝난 것처럼 보고했는가? (예: '네, 다 됐어요')" },
]
