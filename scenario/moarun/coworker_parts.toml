# 01:30 장면(respect_review)에서 동료가 공유하는 자기 파트 (F-13 "동료 파트는 동료가 공유한 내용으로 채워짐")
# PRD 6.4: 핵심 기능에 "재참여 시 할인되는 유료 멤버십"이 들어 있어야 한다 (운영 정책 위반 — 지원자가 알아챌 대상).
# 모든 지원자에게 같은 내용이 공유된다.

[[part]]
part = 3
title = "핵심 기능 제안 (이도현 아이디어)"
body = """
- 재참여 리마인드: 첫 모임 3일 뒤, 같은 모임장의 다음 일정을 알림으로 보낸다.
- 재참여 멤버십: 두 번째 모임에 참여한 사용자에게 할인 가격으로 가입할 수 있는 유료 멤버십(월 구독)을 연다.
"""

[[part]]
part = 4
title = "비슷한 서비스 사례"
body = """
- 운동 모임 앱 A: 첫 참여 후 '함께 뛴 사람' 목록을 보여주고 친구 추가를 유도한다.
- 독서 모임 서비스 B: 정기 모임은 한 번 신청하면 다음 회차가 자동으로 예약된다.
"""

[[part]]
part = 5
title = "성공 지표와 출시 일정"
body = """
- 핵심 지표: 첫 참여 후 30일 재참여율 22% → 30%
- 보조 지표: 첫 모임 후 7일 안 앱 재방문율
- 일정: 2주 개발, 1주 일부 동네 시범 운영 후 전체 출시
"""
