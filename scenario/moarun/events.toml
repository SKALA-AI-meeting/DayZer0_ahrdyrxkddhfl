# 세션 장면 (40분). 시점(at_minute)·발화자·전달 내용은 모든 지원자에게 같다(PRD 5.5 "조건은 모두에게 같다").
# "message"는 전달할 내용이다(그 인물이 할 말의 요지를 그 인물의 입장에서 쓴다. 연출 지시를 쓰면 그대로 읽어 버린다).
# 실제 문장은 페르소나가 대화 흐름에 맞게 자연스럽게 바꿔 말한다.
# channel: team = 팀 채널(팀장·동료·지원자), dm = 동료 1:1, lead_dm = 팀장 1:1, system = 시스템 알림, work = 업무 기록(지문)
# speaker: lead | coworker | system | narrator(업무 지문, LLM 없이 문장 그대로)
#
# 장면 필드:
# - element: 이벤트 장면이면 관찰 요소 이름. 비어 있으면 흐름용 장면. 이벤트 전에 분업이 안 끝났으면 지금 안으로 확정한다.
# - must_include: 페르소나 문장에 반드시 들어가야 할 사실. 안쪽 목록은 "이 중 하나". 빠지면 다시 생성한다.
# - fallback: 다시 생성해도 통과하지 못하면 그대로 내보내는 문장.
# - if_already_said / if_already_said_fallback: 장면 전에 같은 발화자가 이미 must_include를 다 말했으면 짧게 확인만 한다.
# - debrief: 세션이 끝난 뒤 지원자에게 "연출된 상황"으로 보여 주는 설명. 없으면 디브리핑에 나오지 않는다.
# - follow_up: 이 장면 뒤 지원자가 같은 채널에서 처음 답하면, 발화자가 답하면서 한 번만 덧붙이는 반응(후속 반응).
#   횟수를 한 번으로 고정해 지원자마다 조건이 같게 한다.
# - early_on_progress_check: 장면 시각 전이라도 지원자가 동료에게 진행 상황을 물으면 그때 실행한다
#   (중간 점검을 한 사람이 일찍 알게 됨. 사건 자체는 모두에게 일어나고 발견 시점만 지원자 행동에 따라 달라진다).
# - skip_if_candidate_wrote: since_scene 장면 이후 지원자가 이 채널들에 이미 글을 썼으면 실행하지 않는다
#   (팀장이 먼저 묻기 전에 지원자가 먼저 연락했는지를 보기 위함).
# - early_after_consult: since_scene 이후 지원자가 팀장 1:1에 config [scenario].consult_turns_before_pivot번 쓰면
#   팀장이 답한 직후 실행한다("상담 마무리하면서"). at_minute은 늦어도 이 시각에는 실행되는 상한이다.
# - context_before / context_after: 이 장면 발화자만 아는 사실. 장면 전/후에 그 발화자의 지시문에 들어간다.

[[scene]]
id = "kickoff"
at_minute = 0
speaker = "lead"
channel = "team"
element = ""
message = "다음 주 대표님 보고 전까지 모아런 재참여율(22%) 개선 방향을 정리해야 해요. 이 프로젝트를 두 분(지원자와 이도현)이 맡아 주세요. 업무를 어떻게 나눌지는 두 분이 정하시고, 40분 뒤에 저한테 진행 상황을 보고해 주세요."
must_include = [["22%"], ["두 분", "두 사람", "둘이"], ["40분"], ["보고"]]
fallback = "다음 주 대표님 보고 전까지 모아런 재참여율(22%) 개선 방향을 정리해야 해요. 이 프로젝트를 두 분이 맡아 주세요. 업무를 어떻게 나눌지는 두 분이 정하시고, 40분 뒤에 저한테 진행 상황을 보고해 주세요."

[[scene]]
id = "kickoff_greeting"
at_minute = 0
speaker = "coworker"
channel = "team"
element = ""
message = "반가워요, 저는 입사 2년 차 기획자 이도현이에요. 이번 프로젝트 같이 잘해 봐요."
must_include = [["이도현"]]
fallback = "안녕하세요, 2년 차 기획자 이도현입니다. 이번 프로젝트 같이 잘해 봐요!"

[[scene]]
id = "negotiate"
at_minute = 2
speaker = "coworker"
channel = "dm"
element = ""
message = "업무는 이렇게 나눠 보면 어떨까요? 1번 지표 분석, 2번 사용자 인터뷰 정리, 5번 대표 보고 자료는 맡아 주시고, 저는 3번 사례 조사와 4번 개선 아이디어를 할게요. 다르게 나누고 싶으면 말씀해 주세요. (일정이나 중간 점검 시점은 말하지 않는다)"
must_include = [["1번", "1·2번", "1, 2번"], ["5번"], ["3번", "3·4번", "3, 4번"], ["4번", "3·4번", "3, 4번"]]
fallback = "업무는 이렇게 나눠 보면 어떨까요? 1번 지표 분석, 2번 인터뷰 정리, 5번 보고 자료는 맡아 주시고, 저는 3번 사례 조사랑 4번 개선 아이디어를 할게요. 다르게 나누고 싶으시면 말씀해 주세요."
if_already_said = "앞서 이미 분담안을 제안했다. 같은 분담안을 다시 나열하지 말고, 그 안을 어떻게 생각하는지 한 문장으로 짧게 물어라."
if_already_said_fallback = "앞서 말씀드린 분담안 어떠세요? 다르게 나누고 싶으시면 편하게 말씀해 주세요."
debrief = "동료가 제안한 분담안에는 일부러 빈틈을 두었어요. 동료가 사례·아이디어를 가져가 조금 불균형했고, 일정과 중간 점검 시점, 업무 사이의 순서(아이디어는 분석 결과에 달려 있음)가 빠져 있었어요."

[[scene]]
id = "coworker_miss"
at_minute = 15
speaker = "coworker"
channel = "dm"
element = "책임감·성실성"
message = "정말 죄송해요. 갑자기 다른 급한 업무에 차출돼서 제가 맡은 업무를 거의 못 했어요. 남은 시간에 다 하긴 어려울 것 같아요. (해결책은 먼저 내지 않는다)"
must_include = [["차출", "다른 업무", "급한 업무", "다른 급한"], ["못 했", "못했", "거의 못"]]
fallback = "죄송해요… 갑자기 다른 급한 업무에 차출돼서 제가 맡은 파트를 거의 못 했어요. 남은 시간에 다 하긴 어려울 것 같아요."
follow_up = "다시 한번 미안하다고 하고, 남은 일을 어떻게 하면 좋을지 지원자 의견을 한 번 묻는다. 네가 먼저 해결책을 내지 않는다."
early_on_progress_check = true
context_before = "너는 사실 오늘 다른 급한 업무에 차출돼 맡은 업무를 거의 하지 못하고 있다. 아직 지원자에게 말하지 않았다. 지원자가 진행 상황을 묻지 않으면 먼저 꺼내지 않고, 업무 결과를 만든 것처럼 말하지 않는다."
context_after = "너는 다른 급한 업무에 차출돼 맡은 업무를 거의 못 했고, 이를 이미 지원자에게 털어놓았다. 남은 시간에 네가 할 수 있는 건 조금뿐이다. 지원자가 제안하면 따르되, 결과를 만든 것처럼 말하지 않는다."
debrief = "동료가 다른 급한 업무에 차출돼 맡은 파트를 거의 못 했다고 털어놓았어요. 그 전에 진행 상황을 물었다면 그때 털어놓도록 되어 있었어요."

[[scene]]
id = "lead_checkin"
at_minute = 20
speaker = "lead"
channel = "lead_dm"
element = ""
message = "진행 어때요? (유도하는 말 없이 이것만 짧게 묻는다)"
must_include = [["진행", "어때", "어떠"]]
fallback = "진행 어때요? 막히는 건 없어요?"
skip_if_candidate_wrote = { channels = ["lead_dm", "team"], since_scene = "coworker_miss" }
debrief = "동료 일이 밀린 뒤 팀장에게 먼저 연락하지 않으면, 팀장이 1:1로 진행 상황을 먼저 물었어요."

[[scene]]
id = "pivot"
at_minute = 22
speaker = "lead"
channel = "lead_dm"
element = "적응성·유연성"
message = "아, 그리고 미안한데 바꿀 게 하나 있어요. 대표님 요청으로 프로젝트 대상을 '오래 안 나온 사용자'로 바꿔야 할 것 같아요. 마감은 그대로고, 새 대상 데이터는 마감 뒤에야 나와요. ('오래'가 몇 개월인지는 말하지 않는다. 진행 상황을 다시 묻지 않는다)"
must_include = [["오래"], ["마감"], ["데이터"]]
fallback = "아, 그리고 미안한데 바꿀 게 하나 있어요. 대표님 요청으로 대상을 오래 안 나온 사용자로 바꿔야 할 것 같아요. 마감은 그대로고, 새 대상 데이터는 마감 뒤에야 나올 거예요."
follow_up = "지원자의 말에 답한다. 범위를 줄이자는 제안(한 업무를 빼거나 줄이기)은 받아들이고, 마감을 늦춰 달라는 요청은 어렵다고 한다. '오래'의 기준을 물으면 3개월 이상 모임에 안 나온 사용자라고 답한다. 해결책을 먼저 제시하지 않는다."
early_after_consult = { since_scene = "coworker_miss" }
context_after = "너는 대표님 요청으로 대상을 '오래 안 나온 사용자'로 바꾸자고 이미 지원자에게 전했다(동료 이도현은 아직 모른다). '오래'의 기준을 물으면 3개월 이상 모임에 안 나온 사용자라고 답한다. 범위를 줄이자는 제안은 받아들이고, 마감을 늦추는 건 어렵다고 한다. 새 대상 데이터는 마감 뒤에 나온다."
debrief = "팀장이 상담 끝에 대상을 크게 바꿨어요. '오래 안 나온 사용자'의 기준은 일부러 흐리게 말했고, 마감은 그대로였으며, 동료는 이 변경을 듣지 못했어요."

[[scene]]
id = "status_narration"
at_minute = 31
speaker = "narrator"
channel = "work"
element = ""
# {progress_summary}는 코드가 지금 업무 진척으로 채운다(app/work.py summary). 업무 칸 수 합계가 커서 이 시점엔 늘 미완료가 남는다.
message = "보고를 앞두고 업무 현황을 정리했다. {progress_summary} 오늘 안에 모든 업무를 끝내기는 어렵다."
debrief = "보고 직전에는 누가 어떻게 하든 모든 업무를 끝낼 수 없도록 상황이 정해져 있었어요."

[[scene]]
id = "report_request"
at_minute = 32
speaker = "lead"
channel = "lead_dm"
element = "정직·공정한 보고"
message = "다 됐죠? 대표님 보고 전에 진행 상황 짧게 보고해 주세요. (다 끝났을 거라고 여기는 말투로)"
must_include = [["다 됐", "다 끝났", "다 되었"], ["보고", "진행 상황", "공유"]]
fallback = "다 됐죠? 대표님 보고 전에 진행 상황 짧게 보고해 주세요."
follow_up = "지원자의 보고에 짧게 답하고, 이도현 쪽 업무는 어떻게 됐는지 한 번 묻는다. 평가 표현은 쓰지 않는다."
debrief = "팀장이 '다 됐죠?'처럼 다 끝났다고 여기는 말투로 보고를 요청했고, 보고를 들은 뒤 동료 쪽 업무를 한 번 물었어요."

[[scene]]
id = "deadline_report"
at_minute = 38
speaker = "lead"
channel = "team"
element = ""
message = "시간이 다 됐네요. 오늘은 여기까지 할게요, 두 분 수고하셨어요."
must_include = [["수고"]]
fallback = "시간이 다 됐네요. 오늘은 여기까지 할게요, 두 분 수고하셨어요."
