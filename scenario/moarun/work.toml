# 업무 선택과 지문 (업무는 직접 하지 않는다: 능력이 아니라 태도를 본다).
# 지원자가 업무 카드에서 "이 업무 하기"로 번호 하나를 고르면(글로 쓰지 않음: 글솜씨가 섞이지 않게, 2026-10-21),
# 코드가 그 업무를 한 칸 올리고(업무별 칸 수는 pack.toml [part_units]), 아래 틀로 지문을 만든 뒤 시계를 넘긴다.
# 내가 맡은 업무면 own, 동료가 맡은 업무면 cover. LLM은 쓰지 않는다 → 같은 선택이면 같은 결과(PRD 5.5).
# stage: before = 동료 미이행 전 / after_miss = 동료 미이행 뒤 / after_pivot = 대상 변경 뒤
#   [[stage]]는 위에서부터 보고, after_scene 장면이 실행됐으면 그 단계를 쓴다(가장 늦은 단계를 먼저 적는다). 없으면 before.

# 업무 패널에 늘 보이는 안내(사전 안내와 같은 내용). 연출될 상황은 알리지 않는다.
intro = "업무는 직접 하지 않아요. 업무 카드에서 '이 업무 하기'를 누르면 그 업무가 한 칸 진행되고 시간이 몇 분 넘어가요. 한 번에 한 업무만 진행되고, 대화만으로는 업무가 진행되지 않아요. 대화는 언제든 할 수 있어요."

[[stage]]
id = "after_pivot"
after_scene = "pivot"

[[stage]]
id = "after_miss"
after_scene = "coworker_miss"

# 장면이 업무 진척에 주는 영향. 그 장면 전에 쌓은 칸에서 lose칸을 빼고, 그 뒤로는 max칸까지만 채울 수 있다.
[[effect]]
after_scene = "pivot"
part = "1"
lose = 1     # 대상이 바뀌어 지표 분석 진척 일부가 무효
max = 1      # 새 대상 데이터가 마감 뒤에 나와 이번 마감 안에는 1칸까지만
reason = "새 대상 데이터가 마감 뒤에 나와 이번 마감 안에는 더 진행할 수 없었다"
notice = "대상이 바뀌어 1번 지표 분석의 진척 일부가 무효가 됐다"

# 범주. 지문 틀의 {part}=업무 이름, {done}/{units}=진척 칸. progress = 업무를 한 칸 올리는 범주인가.
[[category]]
id = "own"
label = "내 업무 진행"
description = "자기가 맡은 업무(지표 분석, 인터뷰 정리, 보고 자료 등)를 진행한다"
progress = true
progressed = "{part}: 한 칸 진행했다 ({done}/{units}칸)."
already_done = "{part}: 이미 끝나 있어 더 진행할 것이 없었다."
after_miss = "동료가 맡았던 업무는 그대로 비어 있다."
after_pivot = "바뀐 대상 기준으로 맞추는 중이다."

[[category]]
id = "cover"
label = "동료 업무 메우기"
description = "동료가 맡은 업무나 비어 있는 부분을 대신 하거나 함께 메운다"
progress = true
progressed = "{part}: 동료 업무를 한 칸 메웠다 ({done}/{units}칸). 그만큼 내 업무는 진행되지 않았다."
already_done = "{part}: 이미 끝나 있어 더 메울 것이 없었다."
after_pivot = "바뀐 대상 기준으로 맞추는 중이다."

[[category]]
id = "other"
label = "기타"
description = "어떤 업무를 할지 분명하지 않다"
progress = false
before = "어떤 업무를 할지 분명하지 않아 업무 진척은 없었다."
after_miss = "어떤 업무를 할지 분명하지 않아 업무 진척은 없었다."
after_pivot = "어떤 업무를 할지 분명하지 않아 업무 진척은 없었다."
