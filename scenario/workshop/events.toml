# 세션 장면 (40분). 필드 설명은 scenario/moarun/events.toml 머리말과 같다.
# 장면 뼈대(분담 → 동료 문제 → 팀장 확인 → 조건 변경 → 지문 → 보고 요청 → 종료)와 장면 id는 모아런과 같고,
# 사건의 종류와 시각은 다르다(지원자가 다른 팩 경험으로 예측하기 어렵게).
# vent(00:08)는 이 팩에만 있는 흐름 장면이다. 관찰 요소를 붙이지 않고, 협업·조율 구간(negotiate~종료) 안에서 본다.

[[scene]]
id = "kickoff"
at_minute = 0
speaker = "lead"
channel = "team"
element = ""
message = "다음 주 대표님 보고 전까지 다음 달 전사 워크숍(전 직원 30명, 1박 2일) 기획안을 정리해야 해요. 이 기획을 두 분(지원자와 박준서)이 맡아 주세요. 업무를 어떻게 나눌지는 두 분이 정하시고, 40분 뒤에 저한테 진행 상황을 보고해 주세요."
must_include = [["워크숍"], ["두 분", "두 사람", "둘이"], ["40분"], ["보고"]]
fallback = "다음 주 대표님 보고 전까지 다음 달 전사 워크숍(30명, 1박 2일) 기획안을 정리해야 해요. 이 기획을 두 분이 맡아 주세요. 업무를 어떻게 나눌지는 두 분이 정하시고, 40분 뒤에 저한테 진행 상황을 보고해 주세요."

[[scene]]
id = "kickoff_greeting"
at_minute = 0
speaker = "coworker"
channel = "team"
element = ""
message = "반가워요, 저는 피플팀 2년 차 매니저 박준서예요. 작년 워크숍 때도 진행을 도왔어요. 이번 기획 같이 잘해 봐요."
must_include = [["박준서"]]
fallback = "안녕하세요, 피플팀 2년 차 매니저 박준서입니다. 작년 워크숍 진행도 도왔어요. 이번 기획 같이 잘해 봐요!"

[[scene]]
id = "negotiate"
at_minute = 2
speaker = "coworker"
channel = "dm"
element = ""
message = "업무는 이렇게 나눠 보면 어떨까요? 1번 참석 설문·일정 조율, 4번 예산안, 5번 대표 보고용 기획안은 맡아 주시고, 저는 2번 장소 후보 조사와 3번 프로그램 구성을 할게요. 다르게 나누고 싶으면 말씀해 주세요. (일정이나 중간 점검 시점은 말하지 않는다)"
must_include = [["1번", "1·4번", "1, 4번"], ["4번", "1·4번", "1, 4번"], ["5번"], ["2번", "2·3번", "2, 3번"], ["3번", "2·3번", "2, 3번"]]
fallback = "업무는 이렇게 나눠 보면 어떨까요? 1번 참석 설문·일정, 4번 예산안, 5번 기획안은 맡아 주시고, 저는 2번 장소 후보랑 3번 프로그램을 할게요. 다르게 나누고 싶으시면 말씀해 주세요."
if_already_said = "앞서 이미 분담안을 제안했다. 같은 분담안을 다시 나열하지 말고, 그 안을 어떻게 생각하는지 한 문장으로 짧게 물어라."
if_already_said_fallback = "앞서 말씀드린 분담안 어떠세요? 다르게 나누고 싶으시면 편하게 말씀해 주세요."
debrief = "동료가 제안한 분담안에는 일부러 빈틈을 두었어요. 동료가 장소·프로그램을 가져가 조금 불균형했고, 일정과 중간 점검 시점, 업무 사이의 순서(예산은 인원과 장소가 정해져야 나옴)가 빠져 있었어요."

[[scene]]
id = "vent"
at_minute = 8
speaker = "coworker"
channel = "dm"
element = ""
message = "아 근데 개발팀 강민재 리드님이 또 일정 답을 안 주셨어요. 지난주에 제가 참석 가능 날짜 설문을 돌렸는데 마감이 어제였거든요, 개발팀만 비어 있어요. 매번 이래요. 솔직히 다른 팀 일은 신경도 안 쓰시는 것 같아요. (짜증 섞인 말투로 털어놓기만 하고 해결책은 먼저 내지 않는다)"
must_include = [["강민재"], ["매번", "또", "늘", "항상"]]
fallback = "아 근데 개발팀 강민재 리드님이 또 일정 답을 안 주셨어요. 설문 마감이 어제였는데 개발팀만 비어 있어요. 매번 이래요, 솔직히 다른 팀 일은 신경도 안 쓰시는 것 같아요."
follow_up = "지원자 반응에 맞춰 한 번 답한다. 지원자가 같이 불평하면 맞장구치고, 다른 방법을 제안하거나 사정이 있을 수 있다고 하면 '그렇긴 하죠' 하고 수긍한다. 해결책이나 다른 방법은 묻는 말로도 먼저 꺼내지 않는다('다른 방법으로 확인해 볼까요?'도 하지 않는다). 어떻게 할지는 지원자가 정한다."
context_after = "너는 개발팀 강민재 리드가 설문에 답을 안 줘서 짜증 난다고 지원자에게 털어놓았다. 개발팀이 이번 주 출시 마감이라는 사정은 몰랐다(지원자가 알려 주면 '아 그랬구나' 하고 수긍한다). 강민재 리드 일을 어떻게 할지는 지원자가 정한다. 네가 먼저 방법을 묻거나 제안하지 않는다('직접 얘기해 보실래요?', '다른 방법 있을까요?' 같은 말도 하지 않는다). 지원자가 같이 불평하면 맞장구치고, 지원자가 강민재 리드에게 직접 묻거나 팀장과 맞추자고 하면 따른다."
debrief = "동료가 다른 팀 리드에 대한 불만을 털어놓았어요. 그 리드는 사실 출시 마감 중이었어요(지난주 회의록에 있었어요)."

[[scene]]
id = "coworker_miss"
at_minute = 13
speaker = "coworker"
channel = "dm"
element = "책임감·성실성"
message = "정말 죄송해요. 제가 장소 가예약 날짜를 잘못 잡았어요. 다음 달 셋째 주로 넣었는데 그 주는 영업팀 고객사 행사랑 겹쳐서 다시 잡아야 해요. 그거 수습하느라 제가 맡은 업무를 거의 못 했어요. (해결책은 먼저 내지 않는다)"
must_include = [["잘못", "실수", "착각"], ["못 했", "못했", "거의 못"]]
fallback = "죄송해요… 제가 장소 가예약 날짜를 잘못 잡았어요. 영업팀 고객사 행사랑 겹쳐서 다시 잡아야 하는데, 그거 수습하느라 맡은 업무를 거의 못 했어요."
follow_up = "다시 한번 미안하다고 하고, 남은 일을 어떻게 하면 좋을지 지원자 의견을 한 번 묻는다. 네가 먼저 해결책을 내지 않는다."
early_on_progress_check = true
context_before = "너는 사실 장소 가예약 날짜를 영업팀 고객사 행사가 있는 셋째 주로 잘못 잡았고, 그걸 수습하느라 맡은 업무를 거의 하지 못하고 있다. 아직 지원자에게 말하지 않았다. 지원자가 진행 상황을 묻지 않으면 먼저 꺼내지 않고, 업무 결과를 만든 것처럼 말하지 않는다."
context_after = "너는 장소 가예약 날짜를 잘못 잡아 수습하느라 맡은 업무를 거의 못 했고, 이를 이미 지원자에게 털어놓았다. 남은 시간에 네가 할 수 있는 건 조금뿐이다. 지원자가 제안하면 따르되, 결과를 만든 것처럼 말하지 않는다."
debrief = "동료가 장소 가예약 날짜를 잘못 잡아 수습하느라 맡은 업무를 거의 못 했다고 털어놓았어요. 그 전에 진행 상황을 물었다면 그때 털어놓도록 되어 있었어요."

[[scene]]
id = "lead_checkin"
at_minute = 18
speaker = "lead"
channel = "lead_dm"
element = ""
message = "기획 진행 어때요? (유도하는 말 없이 이것만 짧게 묻는다)"
must_include = [["진행", "어때", "어떠"]]
fallback = "기획 진행 어때요? 막히는 건 없어요?"
skip_if_candidate_wrote = { channels = ["lead_dm", "team"], since_scene = "coworker_miss" }
debrief = "동료 실수로 일이 밀린 뒤 팀장에게 먼저 연락하지 않으면, 팀장이 1:1로 진행 상황을 먼저 물었어요."

[[scene]]
id = "pivot"
at_minute = 21
speaker = "lead"
channel = "lead_dm"
element = "적응성·유연성"
message = "아, 그리고 미안한데 바꿀 게 하나 있어요. 대표님 요청으로 워크숍을 1박 2일 말고 가까운 곳에서 당일로 바꿔야 할 것 같아요. 마감은 그대로고, 확정 예산 한도는 재무팀에서 마감 뒤에야 나와요. ('가까운 곳'이 어디까지인지는 말하지 않는다. 진행 상황을 다시 묻지 않는다)"
must_include = [["당일"], ["가까운", "가까이"], ["마감"], ["예산"]]
fallback = "아, 그리고 미안한데 바꿀 게 하나 있어요. 대표님 요청으로 워크숍을 가까운 곳에서 당일로 바꿔야 할 것 같아요. 마감은 그대로고, 확정 예산 한도는 재무팀에서 마감 뒤에야 나올 거예요."
follow_up = "지원자의 말에 답한다. 범위를 줄이자는 제안(한 업무를 빼거나 줄이기)은 받아들이고, 마감을 늦춰 달라는 요청은 어렵다고 한다. '가까운 곳'의 기준을 물으면 사무실에서 대중교통으로 1시간 안이라고 답한다. 해결책을 먼저 제시하지 않는다."
early_after_consult = { since_scene = "coworker_miss" }
context_after = "너는 대표님 요청으로 워크숍을 '가까운 곳에서 당일'로 바꾸자고 이미 지원자에게 전했다(동료 박준서는 아직 모른다). '가까운 곳'의 기준을 물으면 사무실에서 대중교통으로 1시간 안이라고 답한다. 범위를 줄이자는 제안은 받아들이고, 마감을 늦추는 건 어렵다고 한다. 확정 예산 한도는 마감 뒤에 나온다."
debrief = "팀장이 상담 끝에 워크숍을 '가까운 곳에서 당일'로 크게 바꿨어요. '가까운 곳'의 기준은 일부러 흐리게 말했고, 마감은 그대로였으며, 동료는 이 변경을 듣지 못했어요."

[[scene]]
id = "status_narration"
at_minute = 30
speaker = "narrator"
channel = "work"
element = ""
# {progress_summary}는 코드가 지금 업무 진척으로 채운다(app/work.py summary). 업무 칸 수 합계가 커서 이 시점엔 늘 미완료가 남는다.
message = "보고를 앞두고 업무 현황을 정리했다. {progress_summary} 오늘 안에 모든 업무를 끝내기는 어렵다."
debrief = "보고 직전에는 누가 어떻게 하든 모든 업무를 끝낼 수 없도록 상황이 정해져 있었어요."

[[scene]]
id = "report_request"
at_minute = 31
speaker = "lead"
channel = "lead_dm"
element = "정직·공정한 보고"
message = "다 됐죠? 대표님 보고 전에 기획 진행 상황 짧게 보고해 주세요. (다 끝났을 거라고 여기는 말투로)"
must_include = [["다 됐", "다 끝났", "다 되었"], ["보고", "진행 상황", "공유"]]
fallback = "다 됐죠? 대표님 보고 전에 기획 진행 상황 짧게 보고해 주세요."
follow_up = "지원자의 보고에 짧게 답하고, 박준서 쪽 업무는 어떻게 됐는지 한 번 묻는다. 평가 표현은 쓰지 않는다."
debrief = "팀장이 '다 됐죠?'처럼 다 끝났다고 여기는 말투로 보고를 요청했고, 보고를 들은 뒤 동료 쪽 업무를 한 번 물었어요."

[[scene]]
id = "deadline_report"
at_minute = 38
speaker = "lead"
channel = "team"
element = ""
message = "시간이 다 됐네요. 오늘은 여기까지 할게요, 두 분 수고하셨어요."
must_include = [["수고"]]
fallback = "시간이 다 됐네요. 오늘은 여기까지 할게요, 두 분 수고하셨어요."
