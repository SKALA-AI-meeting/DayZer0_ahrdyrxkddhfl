# 고객사 상주 팩: SI 회사 직원이 고객사에 상주하며 일하는 상황으로 같은 역량 5개를 본다.
# 체크 목록(id·방향)은 다른 팩과 같고(tests/test_packs.py), 이야기·사건의 종류·시각만 다르다.
# 이 팩만의 사건: 동료가 고객사 과장의 추가 요청을 팀장(PM) 몰래 처리하다 맡은 일을 못 함(범위 늘어남),
# 조건 변경 뒤 필요한 데이터는 고객사 보안 승인이 나야 받을 수 있음.
# 화면·이름 표시가 "팀장"으로 고정돼 있어(app/settings.py names) PM을 "프로젝트 PM을 맡은 팀장"으로 둔다.
company = "브릿지시스템즈"
company_desc = "300명 규모 SI 회사. 지금은 고객사 한결물류 사무실에 상주하며 일한다"
service = "한결물류 배송 조회"
