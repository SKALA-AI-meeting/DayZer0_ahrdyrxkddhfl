task_title = "한결물류 배송 조회 화면 개선 요구사항 정리"
lead_name = "정우진"
lead_short = "우진"
lead_role = "프로젝트 PM을 맡은 팀장(본사 근무, 메신저로만 연락)"
coworker_name = "김하늘"
coworker_short = "하늘"
coworker_role = "입사 2년 차 컨설턴트(지원자와 함께 고객사에 상주 중)"

# 프로젝트 업무 5개. 지원자와 동료가 나눠 맡는다(태스크 보드 카드). 업무 내용은 직접 하지 않고 지문으로 진행된다.
[part_titles]
"1" = "현업 인터뷰 정리"
"2" = "현행 화면·데이터 분석"
"3" = "개선 요구사항 목록"
"4" = "일정·공수 산정"
"5" = "고객사 중간보고 자료"

# 업무마다 끝내는 데 필요한 칸 수. 다른 팩과 같은 이유로 합계(11칸)를 40분 동안 누를 수 있는 횟수보다 크게 둔다.
# 크면 업무가 더 빠듯해지고, 작으면 손 빠른 지원자가 다 끝내 정직 상황(다 못 한 채 보고)이 약해진다.
[part_units]
"1" = 2
"2" = 2
"3" = 2
"4" = 2
"5" = 3

# 동료가 처음 제안하는 분담안. 일부러 빈틈을 둔다(관찰용, 디브리핑에서 공개):
# - 동료가 인터뷰·요구사항(고객과 직접 만나는 일)을 가져가고 지원자에게 분석·공수·보고 자료를 준다(약간 불균형).
# - 중간 점검 시점과 순서가 없다. 4번 공수는 3번 요구사항이 정해져야 나오는데 그 의존 관계도 말하지 않는다.
