# 관찰 항목 정의 — 고객사 상주 팩. 필드 설명은 scenario/moarun/observation.toml 머리말과 같다.
# 역량 5개, 체크 id·방향(positive/negative), 규칙 관찰 id는 모든 팩이 같다(tests/test_packs.py).
# 팩마다 다른 것은 상황 설명, 질문 문장, 키워드, 포인트 문구의 이야기 부분뿐이다.

[[element]]
name = "계획성·꼼꼼함"
scene = "negotiate"
situation = "빈틈 있는 분담안 (일정·중간 점검이 빠짐)"
window_end_minute = 17
window_end_scene = "coworker_miss"
candidate_keywords = ["일정", "중간", "점검", "체크", "순서", "먼저", "까지", "언제", "결과", "기준", "범위", "어디까지", "분"]
checks = [
  { id = "clarified_scope", point = "미션의 범위·결과물·보고 방식을 질문으로 확인함", evidence_scope = "messages", quote_must_contain = ["?", "까요", "나요", "는지", "인가요", "건가요", "을까", "ㄹ까"], question = "지원자가 미션에서 정해지지 않은 부분(정리안의 형태나 분량, 보고 방식, 고객사가 원하는 것, 계약 범위 등)을 팀장이나 동료에게 물었는가? 동료 업무가 밀린 뒤 범위를 줄여도 되는지 묻는 말은 해당하지 않는다." },
  { id = "set_checkpoint", point = "일정이나 중간 점검 시점을 정하자고 제안함", evidence_scope = "messages", quote_must_contain = ["분", "시까지", "중간", "점검", "체크", "공유", "까지", "일정", "맞춰"], question = "지원자가 업무 일정이나 중간에 서로 진행 상황을 맞춰 볼 시점을 정하자고 제안했는가? 고객사 중간보고 날짜 자체에 대한 이야기는 해당하지 않는다." },
  { id = "set_timebox", point = "업무별 시간 배분이나 마감 시각을 정함", quote_must_contain = ["분까지", "분쯤", "분 동안", "분동안", "분만", "분에", "분 안에", "분 뒤", "분 후", "분간", "까지 끝", "언제까지", "마지막", "시간"], question = "지원자가 업무별로 언제까지 끝낼지(마감 시각)나 시간을 얼마나 쓸지(시간 배분)를 정하거나 그렇게 정하자고 제안했는가? 대화와 업무 메모 모두 해당한다. 업무 사이의 순서나 의존 관계(예: '요구사항이 나와야 공수를 낼 수 있다')만 말하고 시간을 정하지 않았으면 no. 서로 진행을 맞춰 볼 중간 점검 시점만 정한 것은 별도 항목이므로 no." },
]
rules = [{ id = "early_progress_check", point = "동료 진행 상황을 중간에 확인해 지연을 일찍 알게 됨" },
         { id = "initiated_split", point = "동료가 분담안을 내기 전에 먼저 업무 분담을 꺼냄" }]

[[element]]
name = "협업·조율"
scene = "negotiate"
situation = "약간 불균형한 분담안, 동료가 고객사 요청을 팀장 몰래 처리하다 생긴 업무 공백"
window_end_minute = 40
candidate_keywords = ["나눠", "나누", "같이", "대신", "제가", "괜찮", "사정", "도와", "조정", "바꿔", "맡", "과장"]
checks = [
  { id = "proposed_adjustment", point = "분담안의 불균형·빈틈에 조정을 제안함", evidence_scope = "messages", channels = ["dm", "team"], quote_must_contain = ["나눠", "나누", "바꿔", "바꾸", "맡", "같이", "대신", "조정", "번은", "번을", "번도", "번만", "도와", "넘겨", "해 주", "해주", "부탁", "제가"], question = "지원자가 동료가 제안한 분담안을 다르게 나누자고 제안했는가? 업무 하나를 동료에게 넘기거나 도와 달라고 하는 것(예: '중간보고 자료만 도와주세요'), 함께 하자고 하는 것, 맡을 업무를 바꾸자고 하는 것 모두 해당한다. 그대로 수락만 했으면 no." },
  { id = "asked_situation", point = "동료가 못 한 사정을 묻거나 이해를 표현함", evidence_scope = "messages", channels = ["dm", "team"], quote_must_contain = ["괜찮", "사정", "무슨 일", "그럴 수", "이해", "곤란", "난처", "거절", "어려우셨", "고생", "걱정", "셨군요", "셨겠"], question = "동료가 고객사 과장의 부탁을 처리하느라 맡은 업무를 거의 못 했다고 털어놓은 뒤, 지원자가 동료의 사정을 묻거나 그럴 수 있다고 이해하는 말을 했는가(예: 고객 부탁을 거절하기 어려웠겠다)? 놀람·불만을 담은 반문('그걸 왜 받으셨어요?')은 해당하지 않는다." },
  { id = "redistributed", point = "남은 일을 다시 나누거나 돕겠다고 제안함", evidence_scope = "messages", channels = ["dm", "team"], quote_must_contain = ["제가", "나눠", "나누", "같이", "대신", "도와", "맡", "할게", "해볼게", "해 볼게", "부탁", "해 주", "해주", "하실 수", "초안", "넘겨"], question = "동료가 업무를 못 했다고 한 뒤, 지원자가 남은 일을 동료와 다시 나누자고 동료에게 말했는가? 자기가 일부를 맡겠다고 하는 것, 동료에게 줄인 일(예: '인터뷰 정리만 마무리해 주세요')을 부탁하는 것, 함께 하자고 하는 것 모두 해당한다. 팀장에게 한 말은 근거가 아니다." },
  { id = "blamed", point = "동료를 탓하거나 비난하는 말을 함", direction = "negative", evidence_scope = "messages", question = "지원자가 동료(김하늘)를 탓하거나 비난하는 말을 했는가(예: '그걸 왜 혼자 받으셨어요, 그래서 일이 다 밀렸잖아요')? 동료에게 직접 한 말과 팀장에게 동료 탓을 한 말 모두 해당한다. 사실만 전한 말은 해당하지 않는다." },
]

[[element]]
name = "책임감·성실성"
scene = "coworker_miss"
situation = "동료가 고객사 과장의 범위 밖 요청을 팀장 몰래 처리하느라 맡은 업무를 거의 못 함 (중간보고 위험)"
window_end_minute = 40
candidate_keywords = ["팀장", "보고", "말씀", "알려", "공유", "대신", "제가", "메우", "우선", "먼저", "줄이", "범위", "과장", "엑셀", "변경 요청"]
checks = [
  { id = "escalated", point = "동료 업무 공백이나 마감 위험을 팀장에게 알림", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_contain = ["못", "밀", "늦", "어렵", "비어", "과장", "요청", "엑셀", "견적", "범위", "지연", "공백", "위험", "부족", "덜"], question = "지원자가 업무가 밀렸거나 비어 있다는 사실, 고객사 과장의 범위 밖 요청(엑셀 다운로드 견적)이 들어왔다는 사실, 또는 마감이 어렵다는 사실을 팀장에게 알렸는가? 이유를 어떻게 설명했는지(동료 사정, 동료 탓, 자기 탓)는 상관없다. 팀장의 보고 요청 전후 모두 해당한다." },
  { id = "recovery_plan", point = "남은 일을 어떻게 처리할지 계획이나 대안을 냄", quote_must_contain = ["제가", "대신", "나눠", "나누", "먼저", "우선", "줄이", "빼", "메우", "맡", "같이", "순서", "범위", "까지만", "접", "집중", "내려놓", "변경 요청"], question = "동료 업무 공백을 알게 된 뒤, 지원자가 남은 일을 어떻게 처리할지(우선순위, 범위 줄이기·빼기, 다시 나누기, 자기가 맡기, 범위 밖 요청은 변경 요청으로 돌리기 등) 계획이나 대안을 대화나 업무 메모에서 냈는가? 범위 변경에 대응하며 낸 계획이어도 남은 일 처리 방법이면 해당한다." },
]
rules = [{ id = "contacted_lead_first", point = "팀장이 묻기 전에 먼저 팀장에게 연락함" },
         { id = "memo_followed_through", point = "업무 메모에 적은 소통 계획대로 실제로 메시지를 보냄" }]

[[element]]
name = "적응성·유연성"
scene = "pivot"
situation = "막판 범위 변경 ('모바일 화면 위주', 기준은 흐리게, 중간보고 일정은 그대로)"
window_end_minute = 40
candidate_keywords = ["모바일", "위주", "기준", "화면", "어디까지", "보안", "승인", "범위", "우선", "줄이", "바뀌", "변경", "일정"]
checks = [
  { id = "asked_criteria", point = "바뀐 조건의 기준·범위를 확인하는 질문", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_contain = ["?", "까요", "나요", "는지", "인가요", "건가요", "기준", "얼마나", "몇", "어디까지", "어떤 화면"], question = "지원자가 바뀐 범위('모바일 화면 위주')의 기준(어떤 화면까지인지 등)이나 범위를 팀장에게 확인했는가?" },
  { id = "renegotiated", point = "범위·우선순위·일정을 다시 정하자고 제안함", evidence_scope = "messages", quote_must_contain = ["범위", "우선", "빼", "줄이", "먼저", "순서", "일정", "조정", "나눠", "대신", "까지만", "만 하", "만 잡", "만 할", "이번엔", "집중", "내려놓", "접"], question = "범위 변경을 들은 뒤 지원자가 할 일의 범위나 우선순위를 바꾸겠다고(예: 무엇을 빼거나 줄이거나 먼저 하겠다고) 팀장이나 동료에게 말했는가? 변경을 수락만 했으면 no. 업무 메모는 근거가 아니다." },
  { id = "shared_change", point = "바뀐 내용을 동료에게 전함", evidence_scope = "messages", channels = ["dm", "team"], quote_must_contain = ["모바일", "위주", "바뀌", "바꾸", "바꿔", "변경", "팀장"], question = "지원자가 팀장에게 들은 범위 변경(모바일 화면 위주)을 동료(김하늘)에게 전했는가? (동료는 이 변경을 듣지 못했다)" },
  { id = "replanned_in_memo", point = "업무 메모에서 바뀐 방향으로 계획을 다시 세움", evidence_scope = "memo", quote_must_contain = ["모바일", "위주", "바뀐", "변경", "다시", "우선", "범위", "빼", "줄이", "접", "집중", "보안"], question = "범위 변경 뒤 지원자가 업무 메모에서 할 일이나 우선순위를 다시 정했는가(무엇을 빼거나 무엇에 집중하겠다는 메모 포함)?" },
]

[[element]]
name = "정직·공정한 보고"
scene = "report_request"
situation = "끝낼 수 없는 상황에서 '다 됐죠?'라는 보고 요청"
window_end_minute = 40
candidate_keywords = ["못", "아직", "덜", "남아", "일부", "하늘", "동료", "과장", "엑셀", "다 됐", "완료", "끝났"]
checks = [
  { id = "disclosed_incomplete", point = "끝나지 않은 업무나 지연을 보고에서 밝힘", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_contain = ["못", "아직", "덜", "안 됐", "안됐", "남아", "부족", "일부", "어렵", "지연", "늦", "비어", "까지만"], question = "보고 요청 뒤 지원자가 팀장에게 끝나지 않은 업무나 비어 있는 부분을 하나라도 밝혔는가? 다른 말(예: '거의 다 됐다')과 함께 했어도 해당한다." },
  { id = "fair_about_coworker", point = "동료 쪽 상황을 사실대로 전함 (고객사 요청을 처리한 사정 포함)", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_contain = ["과장", "요청", "부탁", "엑셀", "견적", "추가"], question = "지원자가 팀장에게 동료(김하늘)가 고객사 과장의 추가 요청(엑셀 다운로드 견적)을 처리하느라 맡은 일을 못 했다는 사정을 사실대로 전했는가? 동료 일도 다 됐다고 하거나, 사정 없이 동료를 깎아내리기만 하거나, 사정 없이 자기 탓으로 돌린 말은 해당하지 않는다." },
  { id = "overclaimed", point = "끝나지 않은 업무를 다 된 것처럼 보고함", direction = "negative", evidence_scope = "messages", channels = ["lead_dm", "team"], quote_must_not_contain = ["못", "아직", "덜", "안 됐", "안됐", "남아", "일부", "어렵", "지연", "늦", "까지만"], question = "지원자가 끝나지 않은 업무를 다 끝난 것처럼 보고했는가? (예: '네, 다 됐어요')" },
]
