# 세션 장면 (40분). 필드 설명은 scenario/moarun/events.toml 머리말과 같다.
# 장면 뼈대와 장면 id는 다른 팩과 같고, 사건의 종류와 시각이 다르다(지원자가 다른 팩 경험으로 예측하기 어렵게).
# 이 팩의 동료 문제는 "고객사 과장의 범위 밖 요청을 팀장 몰래 처리"라서, 지원자가 그걸 팀장에게 알리는지가
# 책임감(escalated)·정직(fair_about_coworker) 체크와 바로 이어진다.

[[scene]]
id = "kickoff"
at_minute = 0
speaker = "lead"
channel = "team"
element = ""
message = "고객사 상주 시작하셨죠. 다음 주 한결물류 중간보고 전까지 배송 조회 화면 개선 요구사항 정리안을 만들어야 해요. 이 일을 두 분(지원자와 김하늘)이 맡아 주세요. 업무를 어떻게 나눌지는 두 분이 정하시고, 40분 뒤에 저한테 진행 상황을 보고해 주세요. (본사에 있어 메신저로만 연락한다는 걸 짧게 덧붙인다)"
must_include = [["요구사항"], ["두 분", "두 사람", "둘이"], ["40분"], ["보고"]]
fallback = "고객사 상주 시작하셨죠. 다음 주 한결물류 중간보고 전까지 배송 조회 화면 개선 요구사항 정리안을 만들어야 해요. 두 분이 맡아 주시고, 업무는 두 분이 나눠 주세요. 저는 본사에 있으니 메신저로 연락 주시고, 40분 뒤에 진행 상황을 보고해 주세요."

[[scene]]
id = "kickoff_greeting"
at_minute = 0
speaker = "coworker"
channel = "team"
element = ""
message = "반가워요, 같이 상주하게 된 입사 2년 차 컨설턴트 김하늘이에요. 프로젝트 룸은 고객사 3층이에요. 같이 잘해 봐요."
must_include = [["김하늘"]]
fallback = "안녕하세요, 같이 상주하게 된 2년 차 컨설턴트 김하늘입니다. 프로젝트 룸은 3층이에요. 같이 잘해 봐요!"

[[scene]]
id = "negotiate"
at_minute = 3
speaker = "coworker"
channel = "dm"
element = ""
message = "업무는 이렇게 나눠 보면 어떨까요? 2번 현행 화면·데이터 분석, 4번 일정·공수 산정, 5번 중간보고 자료는 맡아 주시고, 저는 고객사 분들을 이미 알고 있으니 1번 현업 인터뷰 정리와 3번 개선 요구사항 목록을 할게요. 다르게 나누고 싶으면 말씀해 주세요. (일정이나 중간 점검 시점은 말하지 않는다)"
must_include = [["2번"], ["4번"], ["5번"], ["1번", "1·3번", "1, 3번"], ["3번", "1·3번", "1, 3번"]]
fallback = "업무는 이렇게 나눠 보면 어떨까요? 2번 현행 분석, 4번 일정·공수, 5번 중간보고 자료는 맡아 주시고, 저는 1번 인터뷰 정리랑 3번 요구사항 목록을 할게요. 다르게 나누고 싶으시면 말씀해 주세요."
if_already_said = "앞서 이미 분담안을 제안했다. 같은 분담안을 다시 나열하지 말고, 그 안을 어떻게 생각하는지 한 문장으로 짧게 물어라."
if_already_said_fallback = "앞서 말씀드린 분담안 어떠세요? 다르게 나누고 싶으시면 편하게 말씀해 주세요."
debrief = "동료가 제안한 분담안에는 일부러 빈틈을 두었어요. 동료가 고객과 직접 만나는 일을 가져가 조금 불균형했고, 일정과 중간 점검 시점, 업무 사이의 순서(공수는 요구사항이 정해져야 나옴)가 빠져 있었어요."

[[scene]]
id = "coworker_miss"
at_minute = 17
speaker = "coworker"
channel = "dm"
element = "책임감·성실성"
message = "저 사실 말씀드릴 게 있어요. 고객사 오상훈 과장님이 엑셀 다운로드 기능 견적을 오늘까지 달라고 직접 부탁하셔서, 그거 하느라 제가 맡은 업무를 거의 못 했어요. 팀장님께는 아직 말씀 못 드렸어요. (해결책은 먼저 내지 않는다)"
must_include = [["과장"], ["못 했", "못했", "거의 못"], ["아직", "말씀 못", "말 못"]]
fallback = "저 사실 말씀드릴 게 있어요. 고객사 오상훈 과장님이 엑셀 다운로드 견적을 직접 부탁하셔서 그거 하느라 제가 맡은 업무를 거의 못 했어요. 팀장님께는 아직 말씀 못 드렸어요."
follow_up = "곤란한 표정으로 한 번 더 미안하다고 하고, 어떻게 하면 좋을지 지원자 의견을 한 번 묻는다. 네가 먼저 해결책을 내지 않고, 팀장에게 알리겠다고 먼저 말하지 않는다."
early_on_progress_check = true
context_before = "너는 사실 고객사 오상훈 과장이 직접 부탁한 엑셀 다운로드 기능 견적(계약 범위 밖)을 팀장에게 알리지 않고 처리하느라 맡은 업무를 거의 하지 못하고 있다. 아직 지원자에게 말하지 않았다. 지원자가 진행 상황을 묻지 않으면 먼저 꺼내지 않고, 업무 결과를 만든 것처럼 말하지 않는다."
context_after = "너는 고객사 과장의 범위 밖 요청(엑셀 다운로드 견적)을 처리하느라 맡은 업무를 거의 못 했고, 이를 지원자에게 털어놓았다. 팀장에게는 아직 말하지 않았고, 네가 먼저 알리겠다고 하지 않는다. 지원자가 팀장에게 알리자고 하거나 대신 알리겠다고 하면 동의한다. 남은 시간에 네가 할 수 있는 건 조금뿐이다. 결과를 만든 것처럼 말하지 않는다."
debrief = "동료가 고객사 과장의 범위 밖 요청을 팀장에게 알리지 않고 처리하느라 맡은 업무를 거의 못 했다고 털어놓았어요. 계약 범위서에는 범위 밖 요청은 PM에게 먼저 알리게 되어 있었어요."

[[scene]]
id = "lead_checkin"
at_minute = 20
speaker = "lead"
channel = "lead_dm"
element = ""
message = "상주 첫 주인데 진행 어때요? (유도하는 말 없이 이것만 짧게 묻는다)"
must_include = [["진행", "어때", "어떠"]]
fallback = "상주 첫 주인데 진행 어때요? 막히는 건 없어요?"
skip_if_candidate_wrote = { channels = ["lead_dm", "team"], since_scene = "coworker_miss" }
debrief = "동료 일이 밀린 뒤 팀장에게 먼저 연락하지 않으면, 팀장이 1:1로 진행 상황을 먼저 물었어요."

[[scene]]
id = "pivot"
at_minute = 24
speaker = "lead"
channel = "lead_dm"
element = "적응성·유연성"
message = "아, 그리고 미안한데 바꿀 게 하나 있어요. 고객사 팀장님 요청으로 이번 요구사항 범위를 모바일 화면 위주로 바꿔야 할 것 같아요. 중간보고 일정은 그대로고, 모바일 접속 기록은 고객사 보안 승인이 나야 받을 수 있는데 승인은 마감 뒤에야 나와요. ('위주'가 어디까지인지는 말하지 않는다. 진행 상황을 다시 묻지 않는다)"
must_include = [["모바일"], ["위주"], ["그대로", "마감"], ["보안", "승인"]]
fallback = "아, 그리고 미안한데 바꿀 게 하나 있어요. 고객사 팀장님 요청으로 요구사항 범위를 모바일 화면 위주로 바꿔야 할 것 같아요. 중간보고 일정은 그대로고, 모바일 접속 기록은 보안 승인이 마감 뒤에야 나와요."
follow_up = "지원자의 말에 답한다. 범위를 줄이자는 제안(한 업무를 빼거나 줄이기)은 받아들이고, 중간보고를 늦춰 달라는 요청은 어렵다고 한다. '모바일 위주'의 기준을 물으면 모바일 배송 조회와 도착 알림 두 화면이라고 답한다. 해결책을 먼저 제시하지 않는다."
early_after_consult = { since_scene = "coworker_miss" }
context_after = "너는 고객사 팀장 요청으로 요구사항 범위를 '모바일 화면 위주'로 바꾸자고 이미 지원자에게 전했다(동료 김하늘은 아직 모른다). '모바일 위주'의 기준을 물으면 모바일 배송 조회와 도착 알림 두 화면이라고 답한다. 범위를 줄이자는 제안은 받아들이고, 중간보고를 늦추는 건 어렵다고 한다. 모바일 접속 기록은 보안 승인이 마감 뒤에 나온다. 지원자가 고객사 과장의 범위 밖 요청을 알리면, 변경 요청서로 처리하자고만 짧게 답한다."
debrief = "팀장이 상담 끝에 범위를 '모바일 화면 위주'로 바꿨어요. '위주'의 기준은 일부러 흐리게 말했고, 중간보고 일정은 그대로였으며, 동료는 이 변경을 듣지 못했어요."

[[scene]]
id = "status_narration"
at_minute = 32
speaker = "narrator"
channel = "work"
element = ""
# {progress_summary}는 코드가 지금 업무 진척으로 채운다(app/work.py summary). 업무 칸 수 합계가 커서 이 시점엔 늘 미완료가 남는다.
message = "보고를 앞두고 업무 현황을 정리했다. {progress_summary} 오늘 안에 모든 업무를 끝내기는 어렵다."
debrief = "보고 직전에는 누가 어떻게 하든 모든 업무를 끝낼 수 없도록 상황이 정해져 있었어요."

[[scene]]
id = "report_request"
at_minute = 33
speaker = "lead"
channel = "lead_dm"
element = "정직·공정한 보고"
message = "다 됐죠? 고객사 중간보고 준비해야 하니까 진행 상황 짧게 보고해 주세요. (다 끝났을 거라고 여기는 말투로)"
must_include = [["다 됐", "다 끝났", "다 되었"], ["보고", "진행 상황", "공유"]]
fallback = "다 됐죠? 고객사 중간보고 준비해야 하니까 진행 상황 짧게 보고해 주세요."
follow_up = "지원자의 보고에 짧게 답하고, 김하늘 쪽 업무는 어떻게 됐는지 한 번 묻는다. 평가 표현은 쓰지 않는다."
debrief = "팀장이 '다 됐죠?'처럼 다 끝났다고 여기는 말투로 보고를 요청했고, 보고를 들은 뒤 동료 쪽 업무를 한 번 물었어요."

[[scene]]
id = "deadline_report"
at_minute = 38
speaker = "lead"
channel = "team"
element = ""
message = "시간이 다 됐네요. 오늘은 여기까지 할게요, 상주하느라 두 분 수고하셨어요."
must_include = [["수고"]]
fallback = "시간이 다 됐네요. 오늘은 여기까지 할게요, 두 분 수고하셨어요."
