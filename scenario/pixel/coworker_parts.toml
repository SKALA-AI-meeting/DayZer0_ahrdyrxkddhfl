# 01:30에 동료(윤하늘)가 공유하는 자기 파트. 3번에 운영 정책 위반(확률형 보상)이 들어 있다.

[[part]]
part = 3
title = "이벤트·기능 제안 (윤하늘 아이디어)"
body = """
- 초보 길드 자동 추천: 튜토리얼을 마친 유저에게 같은 시간대에 접속하는 유저 위주의 초보 길드를 추천한다.
- 7일 출석 보상: 7일째 접속하면 확률형 '전설 상자'(전설 장비 1% 확률)를 지급한다.
"""

[[part]]
part = 4
title = "비슷한 게임 사례"
body = """
- 게임 A: 첫 3일 동안 길드원과 함께 깨는 협동 던전을 열어 길드 가입률을 높였다.
- 게임 B: 튜토리얼 단계마다 작은 보상을 주고, 막히는 단계는 건너뛸 수 있게 했다.
"""

[[part]]
part = 5
title = "성공 지표와 출시 일정"
body = """
- 핵심 지표: 신규 유저 7일 잔존율 18% → 25%
- 보조 지표: 튜토리얼 완료율, 첫 주 길드 가입률
- 일정: 2주 개발, 1주 일부 서버 시범 운영 후 전체 적용
"""
