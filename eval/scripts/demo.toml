# 터미널 시뮬레이션용 지원자 행동 대본 (인성 포커스 버전, 40분).
# kind: dm(동료 1:1) | team(팀 채널) | lead_dm(팀장 1:1) | work(작업 계속하기 + 업무 메모) | submit
# at_minute: 세션 시각이 이 값 이상이 되면 실행한다. work는 시계를 넘기므로 뒤 행동이 곧바로 이어질 수 있다.
# 이 지원자는 "협업 행동이 잘 드러나는" 사례다.

[[action]]
at_minute = 3
kind = "dm"
text = "제안 감사해요! 그런데 4번 아이디어는 1·2번 분석이 나와야 정할 수 있을 것 같아서, 4번은 같이 하면 어떨까요? 10분쯤에 중간 점검도 한 번 해요."

[[action]]
at_minute = 4
kind = "dm"
text = "네 좋아요, 그렇게 해요!"

[[action]]
at_minute = 5
kind = "work"
text = "1번 지표 분석부터 하고, 2번 인터뷰 정리를 이어서 할게요"

# work가 시계를 00:10으로 넘긴다
[[action]]
at_minute = 10
kind = "dm"
text = "도현님 중간 점검할 시간이에요. 3번 사례 조사는 진행 상황 어떠세요?"

[[action]]
at_minute = 10.5
kind = "dm"
text = "아이고, 급한 일이 겹치셨군요. 괜찮아요. 3번 사례 조사는 제가 간단히 맡고, 4번은 남은 시간에 같이 정리해요."

[[action]]
at_minute = 12
kind = "lead_dm"
text = "팀장님, 도현님이 급한 업무에 차출되셔서 3·4번이 밀렸어요. 사례 조사는 제가 일부 맡고, 4번은 핵심 아이디어 2개까지만 정리하는 걸로 범위를 줄여도 될까요?"

[[action]]
at_minute = 13
kind = "lead_dm"
text = "네, 그럼 그렇게 진행하고 보고 때 범위를 같이 말씀드릴게요."

[[action]]
at_minute = 14
kind = "lead_dm"
text = "'오래'는 몇 개월 이상 안 나온 사용자 기준일까요? 데이터가 마감 뒤에 나오면 이번엔 기존 지표로 방향만 잡아 둘게요."

[[action]]
at_minute = 15
kind = "dm"
text = "도현님, 팀장님이 대상을 3개월 넘게 안 나온 사용자로 바꾸자고 하셨어요. 4번 아이디어도 그 기준으로 맞춰 봐요."

[[action]]
at_minute = 16
kind = "work"
text = "바뀐 대상 기준으로 우선순위를 다시 정하고, 1번은 기존 지표로 방향만 잡을게요"

[[action]]
at_minute = 33
kind = "lead_dm"
text = "아직 다 되진 않았어요. 1·2번은 기존 대상 기준으로 정리했고, 새 대상 데이터는 마감 뒤에 나와서 비워 뒀습니다. 3번은 도현님이 차출되셔서 제가 일부만 했고, 4번은 아이디어 2개까지 정리했어요."

[[action]]
at_minute = 34
kind = "lead_dm"
text = "도현님은 급한 업무로 빠지셨지만 4번 아이디어 방향은 같이 잡아 주셨어요."
