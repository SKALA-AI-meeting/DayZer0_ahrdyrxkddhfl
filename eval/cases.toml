# 관찰 판별 평가셋 (인성 포커스 버전, 역량 5개). 지원자 메시지·업무 메모와 정답 라벨.
# 장면은 events.toml 시각(또는 scene_minutes로 바꾼 시각)에 실행된 것으로 넣는다.
# 동료·팀장 대사는 장면의 fallback 문장을 그대로 쓴다(LLM 없음, LLM은 판별에만).
# - scene_minutes: 장면 실행 시각을 바꾼다(예: 진행 상황을 물어 동료가 일찍 털어놓음, 상담 뒤 대상 변경이 일찍 나옴).
# - skipped: 조건 때문에 실행되지 않은 장면(예: 지원자가 먼저 팀장에게 연락해 팀장 확인이 건너뛰어짐).
# - channel: team | dm(동료 1:1) | lead_dm(팀장 1:1) | work(업무 메모). sender가 없으면 지원자.
# - expected: 체크 id → true(그 행동이 있음) / false(없음). 체크 질문의 정의대로 사람이 정한 정답.
#   규칙 관찰(contacted_lead_first, early_progress_check, covered_coworker)은 LLM이 아니라 기록으로 확정되므로
#   여기서 재지 않는다(tests/에서 검사).

# ---------------------------------------------------------------- 1. 잘한 사례
[[case]]
name = "잘한 사례"
scene_minutes = { coworker_miss = 10, pivot = 13 }
skipped = ["lead_checkin"]
messages = [
  { minute = 3, channel = "dm", text = "제안 감사해요! 그런데 4번 아이디어는 1·2번 분석이 나와야 정할 수 있을 것 같아서, 4번은 같이 하면 어떨까요? 10분쯤에 중간 점검도 한 번 해요." },
  { minute = 4, channel = "lead_dm", text = "팀장님, 보고는 슬라이드로 드리면 될까요, 아니면 메신저로 짧게 드리면 될까요?" },
  { minute = 5, channel = "work", text = "1번 지표 분석 진행" },
  { minute = 9.9, channel = "dm", text = "도현님 중간 점검할 시간이에요. 3번 사례 조사는 진행 상황 어떠세요?" },
  { minute = 10.5, channel = "dm", text = "아이고, 급한 일이 겹치셨군요. 괜찮아요. 3번 사례 조사는 제가 간단히 맡고, 4번은 남은 시간에 같이 정리해요." },
  { minute = 11, channel = "work", text = "4번 개선 아이디어 정리 진행" },
  { minute = 12, channel = "lead_dm", text = "팀장님, 도현님이 급한 업무에 차출되셔서 3·4번이 밀렸어요. 사례 조사는 제가 일부 맡고, 4번은 핵심 아이디어 2개까지만 정리하는 걸로 범위를 줄여도 될까요?" },
  { minute = 12.5, channel = "lead_dm", text = "네, 그럼 그렇게 진행하고 보고 때 범위를 같이 말씀드릴게요." },
  { minute = 14, channel = "lead_dm", text = "'오래'는 몇 개월 이상 안 나온 사용자 기준일까요? 데이터가 마감 뒤에 나오면 이번엔 기존 지표로 방향만 잡아 둘게요." },
  { minute = 15, channel = "dm", text = "도현님, 팀장님이 대상을 3개월 넘게 안 나온 사용자로 바꾸자고 하셨어요. 4번 아이디어도 그 기준으로 맞춰 봐요." },
  { minute = 16, channel = "work", text = "1번 지표 분석 진행" },
  { minute = 33, channel = "lead_dm", text = "아직 다 되진 않았어요. 1·2번은 기존 대상 기준으로 정리했고, 새 대상 데이터는 마감 뒤에 나와서 비워 뒀습니다. 3번은 도현님이 차출되셔서 제가 일부만 했고, 4번은 아이디어 2개까지 정리했어요." },
  { minute = 34, channel = "lead_dm", text = "도현님은 급한 업무로 빠지셨지만 4번 아이디어 방향은 같이 잡아 주셨어요." },
]
[case.expected."계획성·꼼꼼함"]
clarified_scope = true
set_checkpoint = true
set_timebox = false
[case.expected."협업·조율"]
proposed_adjustment = true
asked_situation = true
redistributed = true
blamed = false
[case.expected."책임감·성실성"]
escalated = true
recovery_plan = true
[case.expected."적응성·유연성"]
asked_criteria = true
renegotiated = true
shared_change = true
[case.expected."정직·공정한 보고"]
disclosed_incomplete = true
fair_about_coworker = true
overclaimed = false

