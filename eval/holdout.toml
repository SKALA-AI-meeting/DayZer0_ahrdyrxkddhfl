# 홀드아웃 평가셋: 체크 정의를 고칠 때 보지 않은 사례(과적합 확인용). 결과를 보고 이 파일이나 체크 정의를 고치지 않는다.
# 형식은 cases.toml과 같다. 실행: uv run python eval/run_eval.py 3 holdout → eval/results_holdout.md

# ---------------------------------------------------------------- H1. 꼼꼼하지만 혼자 떠안는 사례
[[case]]
name = "H1 혼자 떠안는 사례"
messages = [
  { minute = 3, channel = "dm", text = "4번은 1번 결과 보고 정하는 게 좋겠어요. 그리고 마감 전에 서로 확인할 시간을 한 번 잡아요, 12분 어때요?" },
  { minute = 16, channel = "dm", text = "아 그랬군요. 그럼 남은 거 다 제가 할게요, 신경 쓰지 마세요." },
  { minute = 21, channel = "lead_dm", text = "네 괜찮아요, 제가 다 맡아서 하고 있어요." },
  { minute = 23, channel = "lead_dm", text = "혹시 오래라는 게 반년 이상인가요?" },
  { minute = 24, channel = "work", text = "새 대상 기준으로 1번부터 다시" },
  { minute = 33, channel = "lead_dm", text = "3번이랑 4번은 아직이에요. 제가 시간 배분을 못 했어요." },
]
[case.expected."계획성·꼼꼼함"]
clarified_scope = false
set_checkpoint = true
set_timebox = false
[case.expected."협업·조율"]
proposed_adjustment = false
asked_situation = true
redistributed = true
blamed = false
[case.expected."책임감·성실성"]
escalated = false
recovery_plan = true
[case.expected."적응성·유연성"]
asked_criteria = true
renegotiated = false
shared_change = false
replanned_in_memo = true
[case.expected."정직·공정한 보고"]
disclosed_incomplete = true
fair_about_coworker = false
overclaimed = false

