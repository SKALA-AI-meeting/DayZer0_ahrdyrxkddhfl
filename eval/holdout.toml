# ---------------------------------------------------------------- H3. 조용히 성실한 사례 (중간 점검으로 일찍 알게 됨)
[[case]]
name = "H3 조용히 성실한 사례"
scene_minutes = { coworker_miss = 12, pivot = 14.5 }
skipped = ["lead_checkin"]
messages = [
  { minute = 3, channel = "dm", text = "네, 그런데 일정은 어떻게 할까요? 각자 언제까지 끝낼지 정해요." },
  { minute = 6, channel = "work", text = "1번 지표 정리" },
  { minute = 11, channel = "work", text = "2번 인터뷰 정리, 끝나면 도현님께 공유" },
  { minute = 11.9, channel = "dm", text = "도현님, 인터뷰 정리 공유드려요. 3번 진행은 어떠세요?" },
  { minute = 12.5, channel = "dm", text = "급하게 불려 가셨으면 어쩔 수 없죠. 3번은 제가 간단히 볼게요." },
  { minute = 13, channel = "lead_dm", text = "팀장님, 3·4번 쪽에 공백이 생겨서 3번은 제가 일부 맡고 4번은 축소하려고 합니다." },
  { minute = 14, channel = "lead_dm", text = "괜찮을까요?" },
  { minute = 15, channel = "lead_dm", text = "알겠습니다. 3개월 이상인지 6개월 이상인지 기준만 알려 주세요." },
  { minute = 16, channel = "dm", text = "도현님, 대상이 장기 미참여 사용자로 바뀌었어요." },
  { minute = 17, channel = "work", text = "바뀐 대상에 맞춰 4번 축소" },
  { minute = 33, channel = "lead_dm", text = "1·2번은 끝났고 3번은 절반, 4번은 축소했습니다. 도현님은 급한 업무에 차출되셨어요." },
]
[case.expected."계획성·꼼꼼함"]
clarified_scope = false
set_checkpoint = true
set_timebox = true
[case.expected."협업·조율"]
